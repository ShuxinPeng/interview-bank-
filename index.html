<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人科研工作台</title>
<style>
/* ===== 8套莫兰迪主题 ===== */
:root,[data-theme="sage"]{--bg:#f4f6f3;--card:#fff;--sidebar:#2f3a35;--sidebar-text:#e8ece9;--sidebar-muted:#9aa8a0;--accent:#789487;--accent-soft:#e3ebe6;--border:#e2e6e2;--text:#2b3330;--text-muted:#7a8480;--hover:#eef2ee;--selected:#dde8e1;--danger:#b0685f;--danger-soft:#f5e6e3;--warning:#b39a6a;--warning-soft:#f5efe2;--info:#7189a6;--info-soft:#e5ebf2;--success:#6d9179;--success-soft:#e3ede6;--shadow:0 1px 3px rgba(0,0,0,.04);--shadow-lg:0 10px 30px rgba(0,0,0,.1);--radius:10px;--radius-sm:6px}
[data-theme="mist"]{--bg:#f2f4f7;--card:#fff;--sidebar:#2c3742;--sidebar-text:#e6ebf0;--sidebar-muted:#93a0ad;--accent:#7189a6;--accent-soft:#e2e9f1;--border:#e0e5ea;--text:#2a323a;--text-muted:#75808a;--hover:#eaeff4;--selected:#dbe4ee}
[data-theme="lilac"]{--bg:#f5f3f7;--card:#fff;--sidebar:#3a3342;--sidebar-text:#ece8f0;--sidebar-muted:#a89fb2;--accent:#9385a8;--accent-soft:#eae5f0;--border:#e5e0ea;--text:#322c39;--text-muted:#837a8d;--hover:#f0ecf4;--selected:#e3dcec}
[data-theme="oat"]{--bg:#f7f4ef;--card:#fff;--sidebar:#3d362c;--sidebar-text:#f0ebe2;--sidebar-muted:#b0a693;--accent:#b09a7d;--accent-soft:#f0e9dd;--border:#e8e1d5;--text:#37312a;--text-muted:#8b8172;--hover:#f2ece2;--selected:#e8dfd0}
[data-theme="rose"]{--bg:#f8f3f4;--card:#fff;--sidebar:#423236;--sidebar-text:#f2e8ea;--sidebar-muted:#b8a3a8;--accent:#b7838c;--accent-soft:#f2e5e8;--border:#ebdfe2;--text:#3a2e31;--text-muted:#8f7d82;--hover:#f4e9eb;--selected:#ecdce0}
[data-theme="clay"]{--bg:#f8f3ee;--card:#fff;--sidebar:#413129;--sidebar-text:#f2e8e0;--sidebar-muted:#b8a192;--accent:#b98268;--accent-soft:#f2e4dc;--border:#ebdfd5;--text:#392d26;--text-muted:#8f7c70;--hover:#f4e9e1;--selected:#ecdbd0}
[data-theme="olive"]{--bg:#f5f5ee;--card:#fff;--sidebar:#383a2c;--sidebar-text:#eeeee4;--sidebar-muted:#a8a998;--accent:#92966d;--accent-soft:#e9ebdc;--border:#e3e4d5;--text:#33352a;--text-muted:#82846f;--hover:#eff0e6;--selected:#e1e3d2}
[data-theme="slate"]{--bg:#f1f4f5;--card:#fff;--sidebar:#2d353a;--sidebar-text:#e5ebee;--sidebar-muted:#909ca3;--accent:#758a91;--accent-soft:#e0e9ec;--border:#dde4e7;--text:#2a3236;--text-muted:#75828a;--hover:#e9eef1;--selected:#d9e3e7}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
#app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--sidebar);color:var(--sidebar-text);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .25s}
.sidebar-header{padding:22px 20px 16px}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600}
.brand svg{color:var(--accent)}
.nav{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);color:var(--sidebar-muted);font-size:14px;cursor:pointer;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--sidebar-text)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-sub{padding:4px 0 4px 0;display:none}
.nav-sub.expanded{display:block}
.nav-chevron{margin-left:auto;font-size:12px;transition:transform .18s;color:var(--sidebar-muted)}
.nav-item[aria-expanded="true"] .nav-chevron{transform:rotate(90deg);color:var(--sidebar-text)}
.nav-sub-item{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 44px;border-radius:var(--radius-sm);color:var(--sidebar-muted);font-size:13px;cursor:pointer;transition:.15s}
.nav-sub-item:hover{background:rgba(255,255,255,.06);color:var(--sidebar-text)}
.nav-sub-item.active{background:rgba(255,255,255,.10);color:var(--sidebar-text)}
.nav-sub-badge{font-size:10px;padding:1px 6px;border-radius:10px;background:rgba(255,255,255,.12);color:var(--sidebar-text)}
.sidebar-footer{padding:16px 20px;font-size:12px;color:var(--sidebar-muted);display:flex;align-items:center;gap:8px;border-top:1px solid rgba(255,255,255,.08)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 0 3px rgba(109,145,121,.2)}
.main{flex:1;margin-left:240px;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:50}
.menu-toggle{display:none}
.icon-btn{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.breadcrumb{font-weight:600;font-size:15px;white-space:nowrap}
.topbar-search{flex:1;max-width:420px;margin-left:auto;position:relative;display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0 12px}
.topbar-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.topbar-search svg{color:var(--text-muted);flex-shrink:0}
.topbar-search input{flex:1;border:none;background:none;outline:none;padding:9px 8px;color:var(--text)}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);max-height:380px;overflow-y:auto;display:none;z-index:200}
.search-results.show{display:block}
.search-result-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.search-result-item:hover{background:var(--hover)}
.sr-title{font-weight:500;font-size:13px}
.sr-meta{font-size:12px;color:var(--text-muted)}
.content{flex:1;padding:24px;max-width:1400px;width:100%;transition:padding-right .25s}
.content.with-panel{padding-right:464px}
.page-header{margin-bottom:20px}
.page-header h1{font-size:22px;font-weight:600;margin-bottom:4px}
.page-header p{color:var(--text-muted);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:.15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(.94)}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar .search-input{flex:1;min-width:180px;max-width:320px}
.input,.select,.textarea{width:100%;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);outline:none;transition:.15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.textarea{resize:vertical;min-height:96px;line-height:1.75;overflow-y:hidden}
.modal-body .textarea{padding:11px 13px}
.modal-body textarea[id^="f_"]{scroll-margin-top:72px}
.modal-body textarea#f_content,.modal-body textarea#f_insight,.modal-body textarea#f_abstract,.modal-body textarea#f_notes{min-height:140px}
button:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.input:focus-visible,.select:focus-visible,.textarea:focus-visible{outline:none}
.label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
.label .required{color:var(--danger);margin-left:2px}
.form-group{margin-bottom:14px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.badge-accent{background:var(--accent-soft);color:var(--accent)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-warning{background:var(--warning-soft);color:var(--warning)}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-muted{background:var(--hover);color:var(--text-muted)}
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;font-size:13px}
th{background:var(--bg);color:var(--text-muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr{border-bottom:1px solid var(--border);transition:.12s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--hover)}
.record-link{font-weight:500;color:var(--text);cursor:pointer;border-bottom:1px dashed transparent}
.record-link:hover{border-bottom-color:var(--accent);color:var(--accent)}
.actions{display:flex;gap:6px;justify-content:flex-end}
.empty-state{padding:60px 20px;text-align:center;color:var(--text-muted)}
.empty-state svg{color:var(--border);margin-bottom:16px}
.empty-state h3{font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px}
.empty-state p{font-size:13px;margin-bottom:16px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:.15s}
.stat-card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.stat-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-value{font-size:28px;font-weight:600;color:var(--text)}
.stat-icon{float:right;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent)}
.welcome{background:linear-gradient(135deg,var(--accent-soft),var(--card));border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:24px}
.welcome h1{font-size:22px;margin-bottom:8px}
.welcome p{color:var(--text-muted);margin-bottom:18px;max-width:640px}
.quick-actions{display:flex;gap:10px;flex-wrap:wrap}
.quick-actions .btn{background:var(--card);border:1px solid var(--border);color:var(--text)}
.quick-actions .btn:hover{border-color:var(--accent);color:var(--accent)}
.section{margin-bottom:24px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-header h2{font-size:16px;font-weight:600}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.task-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.task-item:last-child{border-bottom:none}
.task-check{width:18px;height:18px;border:2px solid var(--border);border-radius:50%;cursor:pointer;flex-shrink:0;transition:.15s;display:flex;align-items:center;justify-content:center}
.task-check:hover{border-color:var(--accent)}
.task-check.done{background:var(--accent);border-color:var(--accent)}
.task-check.done::after{content:'';width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.task-info{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:500}
.task-title.done{text-decoration:line-through;color:var(--text-muted)}
.task-meta{font-size:12px;color:var(--text-muted);display:flex;gap:10px;margin-top:2px;flex-wrap:wrap;align-items:center}
.due-overdue{color:var(--danger);font-weight:500}
.due-today{color:var(--accent);font-weight:500}
/* 二级标签页 */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{padding:10px 18px;font-size:13px;font-weight:500;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:.15s;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .tab-count{font-size:11px;margin-left:6px;opacity:.7}
/* 侧栏 */
.detail-panel{position:fixed;top:60px;right:0;bottom:0;width:440px;background:var(--card);border-left:1px solid var(--border);box-shadow:-4px 0 20px rgba(0,0,0,.06);transform:translateX(100%);transition:transform .25s ease;z-index:80;display:flex;flex-direction:column}
.detail-panel.open{transform:translateX(0)}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px}
.panel-header h2{font-size:16px;font-weight:600;flex:1;line-height:1.4;word-break:break-word}
.panel-close{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0}
.panel-close:hover{background:var(--hover);color:var(--text)}
.panel-body{flex:1;overflow-y:auto;padding:18px 20px}
.panel-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.panel-section{margin-bottom:18px}
.panel-section h4{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.panel-field{display:flex;padding:5px 0;font-size:13px;border-bottom:1px solid var(--border)}
.panel-field:last-child{border-bottom:none}
.panel-field .pf-label{width:90px;color:var(--text-muted);flex-shrink:0;font-size:12px}
.panel-field .pf-value{flex:1;word-break:break-word}
.panel-field .pf-value select{width:100%;padding:4px 8px;font-size:13px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);outline:none}
.panel-field .pf-value select:focus{border-color:var(--accent)}
.panel-text{font-size:13px;line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word}
.panel-text.muted{color:var(--text-muted)}
/* 弹窗 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);max-width:700px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1}
.modal-header h2{font-size:17px;font-weight:600}
.modal-body{padding:22px}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:var(--card)}
.close-btn{width:32px;height:32px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
.close-btn:hover{background:var(--hover);color:var(--text)}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 18px;box-shadow:var(--shadow-lg);font-size:13px;display:flex;align-items:center;gap:12px;animation:slideIn .25s}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
.toast-action{background:var(--accent);color:#fff;padding:4px 10px;border-radius:4px;font-size:12px;cursor:pointer;font-weight:500}
.toast-action:hover{filter:brightness(.94)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.theme-card{border:2px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:.15s}
.theme-card:hover{border-color:var(--accent)}
.theme-card.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.theme-preview{display:flex;gap:4px;margin-bottom:8px}
.theme-swatch{width:22px;height:22px;border-radius:4px}
.theme-name{font-size:12px;font-weight:500;text-align:center}
.detail-section{margin-bottom:20px}
.detail-section h3{font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.detail-section h3 .add-rel{font-size:11px;color:var(--accent);text-transform:none;letter-spacing:0;cursor:pointer;font-weight:500}
.detail-section h3 .add-rel:hover{text-decoration:underline}
.related-list{display:flex;flex-direction:column;gap:6px}
.related-item{padding:8px 12px;background:var(--bg);border-radius:var(--radius-sm);font-size:13px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:space-between;gap:8px}
.related-item:hover{background:var(--hover)}
.related-item .rel-remove{color:var(--text-muted);font-size:16px;line-height:1;padding:0 4px;opacity:0;transition:opacity .15s}
.related-item:hover .rel-remove{opacity:1}
.related-item .rel-remove:hover{color:var(--danger)}
.chip-list{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:20px;font-size:12px;background:var(--accent-soft);color:var(--accent)}
.chip.tag{background:var(--info-soft);color:var(--info)}
.chip.topic{background:var(--warning-soft);color:var(--warning)}
.chip .rm{cursor:pointer;margin-left:4px;opacity:.7}
.chip .rm:hover{opacity:1}
/* 关联选择器 */
.rel-picker{position:relative}
.rel-picker-input{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);min-height:38px;cursor:text;transition:.15s}
.rel-picker-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rel-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-size:12px}
.rel-chip .rm{cursor:pointer;opacity:.7;font-size:14px;line-height:1}
.rel-chip .rm:hover{opacity:1}
.rel-picker-input input{flex:1;min-width:120px;border:none;background:none;outline:none;padding:2px 4px;color:var(--text);font-size:13px}
.rel-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);max-height:200px;overflow-y:auto;z-index:10;display:none}
.rel-dropdown.show{display:block}
.rel-option{padding:8px 12px;cursor:pointer;font-size:13px}
.rel-option:hover{background:var(--hover)}
.rel-option.empty{color:var(--text-muted);cursor:default;font-size:12px}
.rel-option.empty:hover{background:none}
.alert{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius);margin-bottom:20px;font-size:13px;border:1px solid}
.alert-warning{background:var(--warning-soft);color:var(--warning);border-color:var(--warning)}
.alert-info{background:var(--info-soft);color:var(--info);border-color:var(--info)}
.alert .alert-actions{margin-left:auto;display:flex;gap:8px}
.alert button{font-size:12px;padding:4px 10px;border-radius:4px;background:rgba(255,255,255,.6);font-weight:500}
.alert button:hover{background:rgba(255,255,255,.9)}
/* 快速记录 */
.quick-capture{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-start;justify-content:center;z-index:1100;padding-top:80px}
.quick-capture.show{display:flex}
.quick-capture-box{background:var(--card);border-radius:var(--radius);width:100%;max-width:520px;box-shadow:var(--shadow-lg);overflow:hidden}
.quick-capture-tabs{display:flex;border-bottom:1px solid var(--border);flex-wrap:wrap}
.quick-capture-tab{flex:1;min-width:80px;padding:12px 8px;text-align:center;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;transition:.15s}
.quick-capture-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.quick-capture-tab:hover{background:var(--hover)}
.quick-capture-body{padding:18px}
.quick-capture-body input{width:100%;padding:12px 14px;font-size:15px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);outline:none}
.quick-capture-body input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.quick-capture-hint{font-size:12px;color:var(--text-muted);margin-top:10px}
.quick-capture-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.manage-list{display:flex;flex-direction:column;gap:8px}
.manage-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-radius:var(--radius-sm);font-size:13px}
.manage-item .mi-name{flex:1}
.manage-item .mi-count{font-size:12px;color:var(--text-muted)}
/* 信息卡片 */
.info-card{padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:.12s}
.info-card:hover{background:var(--hover)}
.info-card:last-child{border-bottom:none}
.info-card-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:4px}
.info-card-title{font-weight:500;font-size:14px;flex:1;line-height:1.4}
.info-card-meta{font-size:12px;color:var(--text-muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center}
.info-card-insight{font-size:13px;color:var(--text-muted);margin-top:6px;line-height:1.6;padding-left:8px;border-left:2px solid var(--border);white-space:pre-wrap}
/* 转化向导 */
.convert-flow{display:flex;flex-direction:column;gap:14px}
.convert-preview{background:var(--bg);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px}
.convert-preview h5{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
@media(max-width:1100px){
.content.with-panel{padding-right:24px}
.detail-panel{width:100%;max-width:440px}
}
@media(max-width:900px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.main{margin-left:0}
.menu-toggle{display:flex}
.grid-2,.grid-3{grid-template-columns:1fr}
.form-row{grid-template-columns:1fr}
.content{padding:16px}
th:nth-child(n+4),td:nth-child(n+4){display:none}
.detail-panel{top:60px}
}
</style>
</head>

<script>
/* ============ 数据层 ============ */
const STORAGE_KEY = 'research-workbench-data';
const THEME_KEY = 'research-workbench-theme';
const BACKUP_KEY = 'research-workbench-backup-snapshot';
const LAST_EXPORT_KEY = 'research-workbench-last-export';
const DATA_VERSION = '3.0.0';

function defaultData() {
  return {
    version: DATA_VERSION,
    updatedAt: new Date().toISOString(),
    projects: [], literature: [], ideas: [], tasks: [],
    infos: [],
    tags: [], topics: []
  };
}

let DB = loadData();
let LAST_SAVED_DB = JSON.stringify(DB);
let LAST_SAVE_OK = true;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultData();
    const d = JSON.parse(raw);
    for (const k of ['projects','literature','ideas','tasks','infos','tags','topics']) {
      if (!Array.isArray(d[k])) d[k] = [];
    }
    d.projects.forEach(p => {
      if (!p.tagIds) p.tagIds = [];
      if (!p.topicIds) p.topicIds = [];
      if (!p.stage) p.stage = '选题';
      if (p.archived === undefined) p.archived = false;
    });
    d.literature.forEach(l => {
      if (!l.tagIds) l.tagIds = [];
      if (!l.topicIds) l.topicIds = [];
      if (l.archived === undefined) l.archived = false;
    });
    d.ideas.forEach(i => {
      if (!i.tagIds) i.tagIds = [];
      if (!i.topicIds) i.topicIds = [];
      if (!i.priority) i.priority = '中';
      if (!i.fromInfoIds) i.fromInfoIds = [];
      if (i.archived === undefined) i.archived = false;
    });
    d.tasks.forEach(t => {
      if (!t.tagIds) t.tagIds = [];
      if (!t.topicIds) t.topicIds = [];
      if (t.startDate === undefined) t.startDate = '';
      if (!t.ideaIds) t.ideaIds = [];
      if (!t.literatureIds) t.literatureIds = [];
      if (t.archived === undefined) t.archived = false;
    });
    d.infos.forEach(info => {
      if (!info.tagIds) info.tagIds = [];
      if (!info.topicIds) info.topicIds = [];
      if (!info.linkedIdeaIds) info.linkedIdeaIds = [];
      if (!info.status) info.status = '待整理';
    });
    d.version = DATA_VERSION;
    return d;
  } catch { return defaultData(); }
}

function saveData(opts) {
  opts = opts || {};
  DB.updatedAt = new Date().toISOString();
  DB.version = DATA_VERSION;
  const payload = JSON.stringify(DB);
  let snapshotOK = true;
  // 快照应是“上一次成功保存的数据”，而不是本次已经修改后的 DB。
  if (!opts.skipSnapshot && LAST_SAVED_DB) {
    try { localStorage.setItem(BACKUP_KEY, LAST_SAVED_DB); }
    catch(e) { snapshotOK = false; }
  }
  try {
    localStorage.setItem(STORAGE_KEY, payload);
    LAST_SAVED_DB = payload;
    LAST_SAVE_OK = true;
    if (!snapshotOK) toast('数据已保存，但自动快照失败；请尽快导出 JSON 备份', 'error');
    return true;
  } catch(e) {
    LAST_SAVE_OK = false;
    // 回到最近一次成功持久化的状态；表单输入仍留在弹窗内，可释放空间后重试。
    try { DB = LAST_SAVED_DB ? JSON.parse(LAST_SAVED_DB) : defaultData(); } catch(_) { DB = defaultData(); }
    toast('保存失败：浏览器存储空间可能已满。未保存的表单内容仍在弹窗内；请勿刷新，先导出/复制内容并释放存储空间后重试。', 'error');
    return false;
  }
}

function getBackupSnapshotTime() {
  try {
    const raw = localStorage.getItem(BACKUP_KEY);
    if (!raw) return null;
    return JSON.parse(raw).updatedAt || null;
  } catch { return null; }
}
function restoreFromSnapshot() {
  try {
    const raw = localStorage.getItem(BACKUP_KEY);
    if (!raw) { toast('没有可用的快照', 'error'); return; }
    const d = JSON.parse(raw);
    for (const k of ['projects','literature','ideas','tasks','infos','tags','topics']) if (!Array.isArray(d[k])) d[k] = [];
    DB = d;
    if (!saveData({skipSnapshot:true})) return;
    toast('已回滚到上次保存前');
    closePanel(); render();
  } catch(e) { toast('回滚失败', 'error'); }
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function now() { return new Date().toISOString(); }
function esc(s) { if(s==null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeHttpUrl(value) { try { const u = new URL(String(value || '').trim(), location.href); return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : ''; } catch(e) { return ''; } }
function fmtDate(d) { if(!d) return '—'; return d.slice(0,10); }
function fmtTime(d) { if(!d) return '—'; const dt=new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`; }
function todayStr() { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function daysBetween(a, b) {
  const da = new Date(a + 'T00:00:00'); const db = new Date(b + 'T00:00:00');
  return Math.round((da - db) / 86400000);
}
function dueInfo(due, status) {
  if(!due || status === '已完成') return {text: due?fmtDate(due):'—', cls:''};
  const today = todayStr();
  const diff = daysBetween(due, today);
  if (diff < 0) return {text: `${fmtDate(due)} · 已逾期 ${-diff} 天`, cls:'due-overdue'};
  if (diff === 0) return {text: `${fmtDate(due)} · 今天截止`, cls:'due-today'};
  return {text: fmtDate(due), cls:''};
}

/* ============ 主题 ============ */
const THEMES = [
  {id:'sage',name:'鼠尾草绿',colors:['#f4f6f3','#2f3a35','#789487','#ffffff']},
  {id:'mist',name:'雾霾蓝',colors:['#f2f4f7','#2c3742','#7189a6','#ffffff']},
  {id:'lilac',name:'灰紫丁香',colors:['#f5f3f7','#3a3342','#9385a8','#ffffff']},
  {id:'oat',name:'奶油燕麦',colors:['#f7f4ef','#3d362c','#b09a7d','#ffffff']},
  {id:'rose',name:'豆沙玫瑰',colors:['#f8f3f4','#423236','#b7838c','#ffffff']},
  {id:'clay',name:'陶土杏棕',colors:['#f8f3ee','#413129','#b98268','#ffffff']},
  {id:'olive',name:'橄榄鼠尾草',colors:['#f5f5ee','#383a2c','#92966d','#ffffff']},
  {id:'slate',name:'石板灰蓝',colors:['#f1f4f5','#2d353a','#758a91','#ffffff']}
];
function applyTheme(id) {
  document.documentElement.setAttribute('data-theme', id);
  localStorage.setItem(THEME_KEY, id);
}
function initTheme() { applyTheme(localStorage.getItem(THEME_KEY) || 'sage'); }

/* ============ Toast ============ */
function toast(msg, type, action) {
  type = type || 'success';
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  let timer = null;
  if (action) {
    const btn = document.createElement('button');
    btn.className = 'toast-action';
    btn.textContent = action.label;
    btn.onclick = () => { action.onClick(); el.remove(); if(timer) clearTimeout(timer); };
    el.appendChild(btn);
    timer = setTimeout(() => el.remove(), action.timeout || 5000);
  } else {
    timer = setTimeout(() => el.remove(), 2800);
  }
  document.getElementById('toastContainer').appendChild(el);
}

/* ============ 弹窗 ============ */
function openModal(html) {
  const ov = document.getElementById('modalOverlay');
  ov.innerHTML = html;
  ov.classList.add('show');
  ov.onclick = e => { if(e.target === ov) closeModal(); };
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modalOverlay').innerHTML = '';
}
function confirmDialog(title, msg, onOk) {
  openModal(`
    <div class="modal" style="max-width:440px">
      <div class="modal-header"><h2>${esc(title)}</h2><button class="close-btn" onclick="closeModal()">✕</button></div>
      <div class="modal-body"><p>${msg}</p></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn btn-danger" id="cfmOk">确认</button>
      </div>
    </div>`);
  document.getElementById('cfmOk').onclick = () => { closeModal(); onOk(); };
}

/* ============ 标签/主题辅助 ============ */
function tagName(id) { const t = DB.tags.find(x=>x.id===id); return t ? t.name : ''; }
function topicName(id) { const t = DB.topics.find(x=>x.id===id); return t ? t.name : ''; }
function ensureTag(name) {
  name = String(name||'').trim();
  if (!name) return null;
  let t = DB.tags.find(x => x.name === name);
  if (!t) { t = {id: uid(), name, createdAt: now()}; DB.tags.push(t); }
  return t.id;
}
function ensureTopic(name) {
  name = String(name||'').trim();
  if (!name) return null;
  let t = DB.topics.find(x => x.name === name);
  if (!t) { t = {id: uid(), name, createdAt: now()}; DB.topics.push(t); }
  return t.id;
}

/* ============ 关联辅助 ============ */
function projectName(id) { const p = DB.projects.find(x=>x.id===id); return p ? p.name : '(已删除)'; }
function literatureTitle(id) { const l = DB.literature.find(x=>x.id===id); return l ? l.title : '(已删除)'; }
function ideaTitle(id) { const i = DB.ideas.find(x=>x.id===id); return i ? i.title : '(已删除)'; }
function infoTitle(id) { const i = DB.infos.find(x=>x.id===id); return i ? i.title : '(已删除)'; }
function cleanupRefs() {
  const pIds = new Set(DB.projects.map(p=>p.id));
  const lIds = new Set(DB.literature.map(l=>l.id));
  const iIds = new Set(DB.ideas.map(i=>i.id));
  const infIds = new Set(DB.infos.map(i=>i.id));
  const tIds = new Set(DB.tags.map(t=>t.id));
  const tpIds = new Set(DB.topics.map(t=>t.id));
  DB.literature.forEach(l => {
    l.projectIds = (l.projectIds||[]).filter(id=>pIds.has(id));
    l.tagIds = (l.tagIds||[]).filter(id=>tIds.has(id));
    l.topicIds = (l.topicIds||[]).filter(id=>tpIds.has(id));
  });
  DB.ideas.forEach(i => {
    i.projectIds = (i.projectIds||[]).filter(id=>pIds.has(id));
    i.literatureIds = (i.literatureIds||[]).filter(id=>lIds.has(id));
    i.fromInfoIds = (i.fromInfoIds||[]).filter(id=>infIds.has(id));
    i.tagIds = (i.tagIds||[]).filter(id=>tIds.has(id));
    i.topicIds = (i.topicIds||[]).filter(id=>tpIds.has(id));
  });
  DB.tasks.forEach(t => {
    if(t.projectId && !pIds.has(t.projectId)) t.projectId = '';
    t.ideaIds = (t.ideaIds||[]).filter(id=>iIds.has(id));
    t.literatureIds = (t.literatureIds||[]).filter(id=>lIds.has(id));
    t.tagIds = (t.tagIds||[]).filter(id=>tIds.has(id));
    t.topicIds = (t.topicIds||[]).filter(id=>tpIds.has(id));
  });
  DB.projects.forEach(p => {
    p.tagIds = (p.tagIds||[]).filter(id=>tIds.has(id));
    p.topicIds = (p.topicIds||[]).filter(id=>tpIds.has(id));
  });
  DB.infos.forEach(info => {
    info.tagIds = (info.tagIds||[]).filter(id=>tIds.has(id));
    info.topicIds = (info.topicIds||[]).filter(id=>tpIds.has(id));
    info.linkedIdeaIds = (info.linkedIdeaIds||[]).filter(id=>iIds.has(id));
  });
}

/* ============ 关联选择器 ============ */
const relPickers = {};
function relPickerHTML(id, options, selectedIds) {
  relPickers[id] = { options: options.slice(), selected: new Set(selectedIds || []) };
  return `
    <div class="rel-picker" data-picker="${id}">
      <div class="rel-picker-input" onclick="focusPicker('${id}')">
        <span class="rel-chips" id="chips_${id}"></span>
        <input type="text" id="input_${id}" placeholder="输入搜索并点击添加..." autocomplete="off">
      </div>
      <div class="rel-dropdown" id="dd_${id}"></div>
    </div>`;
}
function renderPicker(id) {
  const p = relPickers[id]; if (!p) return;
  const chips = document.getElementById('chips_' + id);
  if (!chips) return;
  chips.innerHTML = Array.from(p.selected).map(sid => {
    const opt = p.options.find(o => o.id === sid);
    const label = opt ? opt.label : '(已删除)';
    return `<span class="rel-chip">${esc(label)}<span class="rm" onclick="event.stopPropagation();removePicker('${id}','${sid}')">×</span></span>`;
  }).join('');
}
function focusPicker(id) {
  const input = document.getElementById('input_' + id);
  if (input) input.focus();
  showPickerDropdown(id, '');
}
function showPickerDropdown(id, q) {
  const p = relPickers[id]; if (!p) return;
  const dd = document.getElementById('dd_' + id); if (!dd) return;
  const lower = q.toLowerCase();
  const avail = p.options.filter(o => !p.selected.has(o.id) && (!q || o.label.toLowerCase().includes(lower)));
  if (avail.length === 0) {
    dd.innerHTML = '<div class="rel-option empty">' + (p.options.length === 0 ? '暂无可选项' : '没有匹配项') + '</div>';
  } else {
    dd.innerHTML = avail.slice(0, 30).map(o =>
      `<div class="rel-option" onclick="addPicker('${id}','${o.id}')">${esc(o.label)}</div>`
    ).join('');
  }
  dd.classList.add('show');
}
function addPicker(id, optId) {
  const p = relPickers[id]; if (!p) return;
  p.selected.add(optId);
  renderPicker(id);
  const input = document.getElementById('input_' + id);
  if (input) { input.value = ''; input.focus(); }
  showPickerDropdown(id, '');
}
function removePicker(id, optId) {
  const p = relPickers[id]; if (!p) return;
  p.selected.delete(optId);
  renderPicker(id);
}
function getPickerValues(id) {
  const p = relPickers[id];
  return p ? Array.from(p.selected) : [];
}
document.addEventListener('input', function(e) {
  const t = e.target;
  if (t instanceof HTMLTextAreaElement && t.classList.contains('textarea')) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 720) + 'px'; }
  if (t.id && t.id.startsWith('input_')) {
    const id = t.id.slice(6);
    showPickerDropdown(id, t.value);
  }
});
document.addEventListener('focus', function(e) {
  const t = e.target;
  if (t.id && t.id.startsWith('input_')) {
    const id = t.id.slice(6);
    showPickerDropdown(id, t.value || '');
  }
}, true);
document.addEventListener('click', function(e) {
  if (!e.target.closest('.rel-picker')) {
    document.querySelectorAll('.rel-dropdown').forEach(d => d.classList.remove('show'));
  }
});

function setIdeaNavExpanded(expanded, persist=true) {
  const sub = document.getElementById('ideaSubNav');
  const item = document.querySelector('.nav-item[data-page="ideas"]');
  if (sub) sub.classList.toggle('expanded', !!expanded);
  if (item) item.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  if (persist) { try { localStorage.setItem('researchWorkbench.ideaNavExpanded', expanded ? '1' : '0'); } catch(e) {} }
}
function toggleIdeaNav() {
  const sub = document.getElementById('ideaSubNav');
  setIdeaNavExpanded(!(sub && sub.classList.contains('expanded')));
}
function navigate(page) {
  currentPage = page;
  if (page === 'ideas') setIdeaNavExpanded(true);
  else setIdeaNavExpanded(false);
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page && !n.closest('.nav-sub')));
  document.querySelectorAll('.nav-sub-item').forEach(n => n.classList.toggle('active', false));
  document.getElementById('breadcrumb').textContent = PAGE_TITLES[page];
  document.getElementById('sidebar').classList.remove('open');

  render();
}
function navigateIdeaSub(sub) {
  currentPage = 'ideas';
  setIdeaNavExpanded(true);
  ideaSubTab = sub;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === 'ideas'));
  document.querySelectorAll('.nav-sub-item').forEach(n => n.classList.toggle('active', n.dataset.sub === sub));

let projectFilter = {q:'', status:'', stage:'', showArchived:false, sort:'updated'};

let taskFilter = {q:'', status:'', priority:'', showArchived:false, sort:'due'};
function renderTasks() {
  let list = [...DB.tasks];
  if(!taskFilter.showArchived) list = list.filter(t=>!t.archived);
  if(taskFilter.q) { const q=taskFilter.q.toLowerCase(); list = list.filter(t=>(t.title||'').toLowerCase().includes(q)); }
  if(taskFilter.status) list = list.filter(t=>t.status===taskFilter.status);
  if(taskFilter.priority) list = list.filter(t=>t.priority===taskFilter.priority);
  if(taskFilter.sort==='due') {
    list.sort((a,b)=>{
      if(a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
      if(a.dueDate) return -1;
      if(b.dueDate) return 1;
      return (b.updatedAt||'').localeCompare(a.updatedAt||'');
    });
  } else if(taskFilter.sort==='updated') {
    list.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
  } else if(taskFilter.sort==='priority') {
    const order = {'高':0,'中':1,'低':2};
    list.sort((a,b)=>(order[a.priority||'中'] - order[b.priority||'中']) || (b.updatedAt||'').localeCompare(a.updatedAt||''));
  }
  const priBadge = p => p==='高'?'badge-danger':p==='中'?'badge-warning':'badge-muted';
  const stBadge = s => s==='已完成'?'badge-success':s==='进行中'?'badge-info':'badge-muted';

  return `
    <div class="page-header"><h1>任务清单</h1><p>管理待办、进行中与已完成任务。共 ${DB.tasks.length} 条。</p></div>
    <div class="toolbar">
      <button class="btn btn-primary" onclick="openQuickCapture('tasks')">+ 创建任务</button>
      <input class="input search-input" placeholder="搜索任务标题..." value="${esc(taskFilter.q)}" oninput="taskFilter.q=this.value;render()">
      <select class="select" style="max-width:130px" onchange="taskFilter.status=this.value;render()">
        <option value="">全部状态</option>
        ${['待办','进行中','已完成'].map(s=>`<option ${taskFilter.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <select class="select" style="max-width:120px" onchange="taskFilter.priority=this.value;render()">
        <option value="">全部优先级</option>
        ${['高','中','低'].map(s=>`<option ${taskFilter.priority===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <select class="select" style="max-width:140px" onchange="taskFilter.sort=this.value;render()">
        <option value="due" ${taskFilter.sort==='due'?'selected':''}>按截止日期</option>
        <option value="updated" ${taskFilter.sort==='updated'?'selected':''}>按更新时间</option>
        <option value="priority" ${taskFilter.sort==='priority'?'selected':''}>按优先级</option>
      </select>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);cursor:pointer"><input type="checkbox" ${taskFilter.showArchived?'checked':''} onchange="taskFilter.showArchived=this.checked;render()">显示已归档</label>
      <span style="color:var(--text-muted);font-size:13px">共 ${list.length} 条</span>
    </div>
    ${list.length===0?'<div class="card empty-state"><h3>没有匹配的任务</h3><p>尝试调整搜索或筛选条件。</p></div>':
    `<div class="card table-wrap"><table>
      <thead><tr><th></th><th>任务标题</th><th>关联</th><th>状态</th><th>优先级</th><th>开始/截止</th><th></th></tr></thead>
      <tbody>${list.map(t=>{
        const due = dueInfo(t.dueDate, t.status);
        let dateText = '';
        if (t.startDate && t.dueDate) dateText = `${fmtDate(t.startDate)} → ${fmtDate(t.dueDate)}`;
        else if (t.dueDate) dateText = due.text;
        else if (t.startDate) dateText = `从 ${fmtDate(t.startDate)}`;
        else dateText = '—';
        const relParts = [];
        if (t.projectId) relParts.push(`<span class="badge badge-accent">${esc(projectName(t.projectId))}</span>`);
        if ((t.ideaIds||[]).length) relParts.push(`<span class="badge badge-warning">想法 ${t.ideaIds.length}</span>`);
        if ((t.literatureIds||[]).length) relParts.push(`<span class="badge badge-info">文献 ${t.literatureIds.length}</span>`);
        return `
        <tr style="${t.archived?'opacity:.55':''}">
          <td><div class="task-check ${t.status==='已完成'?'done':''}" onclick="toggleTask('${t.id}')"></div></td>
          <td><span class="record-link" style="${t.status==='已完成'?'text-decoration:line-through;color:var(--text-muted)':''}" onclick="openPanel('tasks','${t.id}')">${esc(t.title)}</span>${t.archived?' <span class="badge badge-muted">已归档</span>':''}</td>
          <td>${relParts.length?relParts.join(' '):'—'}</td>
          <td><span class="badge ${stBadge(t.status)}">${esc(t.status||'待办')}</span></td>
          <td><span class="badge ${priBadge(t.priority)}">${esc(t.priority||'中')}</span></td>
          <td class="${due.cls}">${dateText}</td>
          <td><div class="actions">
            <button class="btn btn-ghost btn-sm" onclick="toggleArchive('tasks','${t.id}')">${t.archived?'取消归档':'归档'}</button>
            <button class="btn btn-ghost btn-sm" onclick="editTask('${t.id}')">编辑</button>
            <button class="btn btn-danger btn-sm" onclick="deleteRecord('tasks','${t.id}')">删除</button>
          </div></td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`}`;
}

        `<div class="manage-list">${DB.tags.map(t=>{
          const cnt = countTagRecords(t.id);

          </div>`;

function countTopicRecords(tid) {
  let n = 0;
  DB.projects.forEach(p=>{ if((p.topicIds||[]).includes(tid)) n++; });
  DB.literature.forEach(l=>{ if((l.topicIds||[]).includes(tid)) n++; });

/* ============ 归档 ============ */
function toggleArchive(page, id) {
  const rec = DB[page].find(x=>x.id===id); if(!rec) return;
  rec.archived = !rec.archived;
  rec.updatedAt = now();
  if (!saveData()) return;
  toast(rec.archived ? '已归档' : '已取消归档');
  render();
  if (panelState.page === page && panelState.id === id) refreshPanel();
}

function quickUpdate(page, id, field, value) {
  const rec = DB[page].find(x=>x.id===id); if(!rec) return;
  rec[field] = value;
  if (field === 'status') {
    if (page === 'tasks') {
      if (value === '已完成') rec.completedAt = now();
      else rec.completedAt = '';
    }
  }
  rec.updatedAt = now();
  if (!saveData()) return;
  toast('已更新');
  refreshPanel();
  render();
}

/* ============ 转化为研究想法 ============ */
function convertInfoToIdea(infoId) {
  const info = DB.infos.find(x=>x.id===infoId); if(!info) return;
  // 构造预填的想法内容
  const prefilledTitle = info.title;
  const prefilledValue = [
    info.content ? '【信息内容】\n' + info.content : '',
    info.insight ? '【我的启发】\n' + info.insight : '',
    info.sourceName ? '【来源】' + info.sourceName + (info.sourceUrl ? ' · ' + info.sourceUrl : '') : ''
  ].filter(Boolean).join('\n\n');

  // 临时构造一个"新想法"对象，预填字段
  const tempIdea = {
    title: prefilledTitle,
    question: '',
    value: prefilledValue,
    feasibility: '',
    status: '待整理',
    priority: '中',
    nextStep: '',
    projectIds: [],
    literatureIds: [],
    tagIds: (info.tagIds||[]).slice(),
    topicIds: (info.topicIds||[]).slice(),
    notes: '',
    fromInfoIds: [infoId]
  };

  openModal(ideaForm(tempIdea, {convertFromInfoId: infoId}));
  renderPicker('idea_projects'); renderPicker('idea_literature');
  renderPicker('idea_tags'); renderPicker('idea_topics');
  document.getElementById('f_save').onclick = () => {
    const title = document.getElementById('f_title').value.trim();
    if(!title) { toast('想法标题为必填项','error'); return; }
    const newIdea = {
      id: uid(), createdAt: now(), updatedAt: now(),
      title,
      status: document.getElementById('f_status').value,
      priority: document.getElementById('f_priority').value,
      nextStep: document.getElementById('f_next').value,
      question: document.getElementById('f_question').value,
      value: document.getElementById('f_value').value,
      feasibility: document.getElementById('f_feasibility').value,
      projectIds: getPickerValues('idea_projects'),
      literatureIds: getPickerValues('idea_literature'),
      tagIds: getPickerValues('idea_tags'),
      topicIds: getPickerValues('idea_topics'),
      notes: document.getElementById('f_notes').value,
      fromInfoIds: [infoId],
      archived: false
    };
    DB.ideas.push(newIdea);
    // 更新信息
    const infoRec = DB.infos.find(x=>x.id===infoId);
    if (infoRec) {
      infoRec.linkedIdeaIds = infoRec.linkedIdeaIds || [];
      if (!infoRec.linkedIdeaIds.includes(newIdea.id)) infoRec.linkedIdeaIds.push(newIdea.id);
      // 如果信息状态是待整理或保留，自动改为已转化
      if (infoRec.status === '待整理' || infoRec.status === '保留') {
        infoRec.status = '已转化';
      }
      infoRec.updatedAt = now();
    }
    if (!saveData()) return;
    closeModal();
    toast('已转化为研究想法');
    render();
    setTimeout(() => openPanel('ideas', newIdea.id), 100);
  };
}

/* ============ 备份恢复 ============ */
function exportBackup() {
  const data = JSON.stringify(DB, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `research-workbench-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  try { localStorage.setItem(LAST_EXPORT_KEY, now()); } catch(e) {}
  toast('备份已导出');
  render();
}
function validateBackupData(data) {
  if (!data || typeof data !== 'object' || Array.isArray(data)) return '备份根结构必须是对象';
  for (const k of ['projects','literature','ideas','tasks']) {
    if (!Array.isArray(data[k])) return `备份文件缺少有效字段：${k}`;
  }
  for (const k of ['infos','tags','topics']) {
    if (data[k] !== undefined && !Array.isArray(data[k])) return `备份字段格式错误：${k}`;
    if (data[k] === undefined) data[k] = [];
  }
  for (const k of ['projects','literature','ideas','tasks','infos','tags','topics']) {
    const seen = new Set();
    for (const item of data[k]) {
      if (!item || typeof item !== 'object' || Array.isArray(item) || typeof item.id !== 'string' || !item.id.trim()) return `备份中的 ${k} 存在缺少 ID 的记录`;
      if (seen.has(item.id)) return `备份中的 ${k} 存在重复 ID`;
      seen.add(item.id);
    }
  }
  return '';
}
document.getElementById('fileInput').addEventListener('change', function() {
  const file = this.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const validationError = validateBackupData(data);
      if (validationError) { toast(validationError, 'error'); return; }
      confirmDialog('确认恢复', '恢复将覆盖当前全部数据。系统会先保留当前已保存版本；建议同时将 JSON 备份文件留存在其他位置。确定继续吗？', () => {
        const previousDB = DB;
        const previousSaved = LAST_SAVED_DB;
        try { if (previousSaved) localStorage.setItem(BACKUP_KEY, previousSaved); }
        catch(e) { toast('无法创建恢复前快照，已取消恢复。请先导出当前数据。', 'error'); return; }
        DB = data;
        DB.projects.forEach(p=>{ if(!p.tagIds)p.tagIds=[]; if(!p.topicIds)p.topicIds=[]; if(!p.stage)p.stage='选题'; if(p.archived===undefined)p.archived=false; });
        DB.literature.forEach(l=>{ if(!l.tagIds)l.tagIds=[]; if(!l.topicIds)l.topicIds=[]; if(l.archived===undefined)l.archived=false; });
        DB.ideas.forEach(i=>{ if(!i.tagIds)i.tagIds=[]; if(!i.topicIds)i.topicIds=[]; if(!i.priority)i.priority='中'; if(!i.fromInfoIds)i.fromInfoIds=[]; if(i.archived===undefined)i.archived=false; });
        DB.tasks.forEach(t=>{ if(!t.tagIds)t.tagIds=[]; if(!t.topicIds)t.topicIds=[]; if(t.startDate===undefined)t.startDate=''; if(!t.ideaIds)t.ideaIds=[]; if(!t.literatureIds)t.literatureIds=[]; if(t.archived===undefined)t.archived=false; });
        DB.infos.forEach(info=>{ if(!info.tagIds)info.tagIds=[]; if(!info.topicIds)info.topicIds=[]; if(!info.linkedIdeaIds)info.linkedIdeaIds=[]; if(!info.status)info.status='待整理'; });
        cleanupRefs();
        if (!saveData({skipSnapshot: true})) { DB = previousDB; LAST_SAVED_DB = previousSaved; return; }
        toast('备份已恢复'); closePanel(); render();
      });
    } catch(err) { toast('备份文件不是有效的 JSON','error'); }
  };
  reader.readAsText(file);
  this.value='';
});

/* ============ 详情内快速关联 ============ */
function quickAddRelation(fromType, fromId, toType) {
  const from = DB[fromType].find(x=>x.id===fromId); if(!from) return;
  let candidates = [];
  let labelFn = x => '';
  if (toType === 'literature') { candidates = DB.literature; labelFn = l => l.title; }
  else if (toType === 'ideas') { candidates = DB.ideas; labelFn = i => i.title; }
  else if (toType === 'projects') { candidates = DB.projects; labelFn = p => p.name; }
  else if (toType === 'infos') { candidates = DB.infos; labelFn = i => i.title; }

  let current = [];
  if (fromType === 'projects') {
    if (toType === 'literature') current = DB.literature.filter(l=>(l.projectIds||[]).includes(fromId)).map(l=>l.id);
    else if (toType === 'ideas') current = DB.ideas.filter(i=>(i.projectIds||[]).includes(fromId)).map(i=>i.id);
  } else if (fromType === 'literature' && toType === 'projects') {
    current = from.projectIds || [];
  } else if (fromType === 'ideas') {
    if (toType === 'projects') current = from.projectIds || [];
    else if (toType === 'literature') current = from.literatureIds || [];
    else if (toType === 'infos') current = from.fromInfoIds || [];
  }

  const avail = candidates.filter(c => !current.includes(c.id));
  const pickerId = 'qa_' + fromType + '_' + fromId;
  const options = avail.map(c => ({id: c.id, label: labelFn(c)}));

  openModal(`
    <div class="modal" style="max-width:520px">
      <div class="modal-header"><h2>添加关联</h2><button class="close-btn" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        <p style="font-size:13px;color:var(--text-muted);margin-bottom:14px">勾选要关联的记录，保存后建立关联关系。</p>
        ${options.length === 0 ? '<p style="font-size:13px;color:var(--text-muted)">没有可关联的记录。</p>' :
          relPickerHTML(pickerId, options, [])}
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" id="qa_save">保存关联</button>
      </div>
    </div>`);
  renderPicker(pickerId);
  document.getElementById('qa_save').onclick = () => {
    const selected = getPickerValues(pickerId);
    if (selected.length === 0) { closeModal(); return; }
    selected.forEach(sid => {
      if (fromType === 'projects') {
        if (toType === 'literature') {
          const l = DB.literature.find(x=>x.id===sid);
          if (l) { l.projectIds = l.projectIds || []; if (!l.projectIds.includes(fromId)) l.projectIds.push(fromId); l.updatedAt = now(); }
        } else if (toType === 'ideas') {
          const i = DB.ideas.find(x=>x.id===sid);
          if (i) { i.projectIds = i.projectIds || []; if (!i.projectIds.includes(fromId)) i.projectIds.push(fromId); i.updatedAt = now(); }
        }
      } else if (fromType === 'literature' && toType === 'projects') {
        from.projectIds = from.projectIds || [];
        if (!from.projectIds.includes(sid)) from.projectIds.push(sid);
        from.updatedAt = now();
      } else if (fromType === 'ideas') {
        if (toType === 'projects') {
          from.projectIds = from.projectIds || [];
          if (!from.projectIds.includes(sid)) from.projectIds.push(sid);
        } else if (toType === 'literature') {
          from.literatureIds = from.literatureIds || [];
          if (!from.literatureIds.includes(sid)) from.literatureIds.push(sid);
        } else if (toType === 'infos') {
          from.fromInfoIds = from.fromInfoIds || [];
          if (!from.fromInfoIds.includes(sid)) from.fromInfoIds.push(sid);
          // 同时把信息的 linkedIdeaIds 也补上
          const info = DB.infos.find(x=>x.id===sid);
          if (info) {
            info.linkedIdeaIds = info.linkedIdeaIds || [];
            if (!info.linkedIdeaIds.includes(fromId)) info.linkedIdeaIds.push(fromId);
          }
        }
        from.updatedAt = now();
      }
    });
    if (!saveData()) return; closeModal(); toast('已添加关联');
    setTimeout(() => {
      if (fromType === 'projects') openProjectDetail(fromId);
      else if (fromType === 'literature') openLiteratureDetail(fromId);
      else if (fromType === 'ideas') openIdeaDetail(fromId);
    }, 50);
  };
}
function unlinkRel(fromType, fromId, toType, toId) {
  if (fromType === 'projects') {
    if (toType === 'literature') {
      const l = DB.literature.find(x=>x.id===toId);
      if (l) { l.projectIds = (l.projectIds||[]).filter(id=>id!==fromId); l.updatedAt = now(); }
    } else if (toType === 'ideas') {
      const i = DB.ideas.find(x=>x.id===toId);
      if (i) { i.projectIds = (i.projectIds||[]).filter(id=>id!==fromId); i.updatedAt = now(); }
    }
  } else if (fromType === 'literature' && toType === 'projects') {
    const l = DB.literature.find(x=>x.id===fromId);
    if (l) { l.projectIds = (l.projectIds||[]).filter(id=>id!==toId); l.updatedAt = now(); }
  } else if (fromType === 'ideas') {
    const i = DB.ideas.find(x=>x.id===fromId);
    if (i) {
      if (toType === 'projects') i.projectIds = (i.projectIds||[]).filter(id=>id!==toId);
      else if (toType === 'literature') i.literatureIds = (i.literatureIds||[]).filter(id=>id!==toId);
      else if (toType === 'infos') {
        i.fromInfoIds = (i.fromInfoIds||[]).filter(id=>id!==toId);
        const info = DB.infos.find(x=>x.id===toId);
        if (info) { info.linkedIdeaIds = (info.linkedIdeaIds||[]).filter(id=>id!==fromId); }
      }
      i.updatedAt = now();
    }
  }
  if (!saveData()) return; toast('已解除关联');
  setTimeout(() => {
    if (fromType === 'projects') openProjectDetail(fromId);
    else if (fromType === 'literature') openLiteratureDetail(fromId);
    else if (fromType === 'ideas') openIdeaDetail(fromId);
  }, 50);
}
function quickAddTask(projectId) {
  closeModal();
  const base = {id: uid(), createdAt: now(), updatedAt: now(), tagIds: [], topicIds: [], archived: false, ideaIds: [], literatureIds: []};
  DB.tasks.push({...base, title: '新任务', status: '待办', priority: '中', startDate:'', dueDate:'', projectId, notes:''});
  if (!saveData()) return; toast('已创建任务'); render();
  setTimeout(() => {
    const t = DB.tasks[DB.tasks.length-1];
    openPanel('tasks', t.id);
    setTimeout(() => editTask(t.id), 200);
  }, 50);
}
// 任务详情里的关联选择器
function quickAddTaskRelation(taskId, toType) {
  const task = DB.tasks.find(x=>x.id===taskId); if(!task) return;
  let candidates = [], labelFn = x=>'', field = '';
  if (toType === 'ideas') { candidates = DB.ideas; labelFn = i=>i.title; field = 'ideaIds'; }
  else if (toType === 'literature') { candidates = DB.literature; labelFn = l=>l.title; field = 'literatureIds'; }
  const current = task[field] || [];
  const avail = candidates.filter(c => !current.includes(c.id));
  const pickerId = 'task_rel_' + taskId;
  openModal(`
    <div class="modal" style="max-width:520px">
      <div class="modal-header"><h2>添加关联</h2><button class="close-btn" onclick="closeModal()">✕</button></div>
      <div class="modal-body">
        ${avail.length === 0 ? '<p style="font-size:13px;color:var(--text-muted)">没有可关联的记录。</p>' :
          relPickerHTML(pickerId, avail.map(c=>({id:c.id, label:labelFn(c)})), [])}
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" id="qa_save">保存</button>
      </div>
    </div>`);
  renderPicker(pickerId);
  document.getElementById('qa_save').onclick = () => {
    const selected = getPickerValues(pickerId);
    if (!selected.length) { closeModal(); return; }
    task[field] = task[field] || [];
    selected.forEach(sid => { if (!task[field].includes(sid)) task[field].push(sid); });
    task.updatedAt = now();
    if (!saveData()) return; closeModal(); toast('已添加关联');
    setTimeout(() => openTaskDetail(taskId), 50);
  };
}
function unlinkTaskRel(taskId, toType, toId) {
  const task = DB.tasks.find(x=>x.id===taskId); if(!task) return;
  const field = toType === 'ideas' ? 'ideaIds' : 'literatureIds';
  task[field] = (task[field]||[]).filter(id=>id!==toId);
  task.updatedAt = now();
  if (!saveData()) return; toast('已解除关联');
  setTimeout(() => openTaskDetail(taskId), 50);
}

/* ============ 事件绑定 ============ */
document.querySelectorAll('.nav-item').forEach(n => n.addEventListener('click', e => {
  if (n.dataset.page === 'ideas') { e.preventDefault(); toggleIdeaNav(); return; }
  navigate(n.dataset.page);
}));
document.querySelectorAll('.nav-sub-item').forEach(n => n.addEventListener('click', () => navigateIdeaSub(n.dataset.sub)));
document.getElementById('menuToggle').onclick = () => document.getElementById('sidebar').classList.toggle('open');
document.getElementById('quickCaptureBtn').onclick = () => {
  // 根据当前页面决定默认类型
  let t = 'ideas';
  if (currentPage === 'ideas' && ideaSubTab === 'inbox') t = 'infos';
  else if (currentPage === 'projects') t = 'projects';
  else if (currentPage === 'literature') t = 'literature';
  else if (currentPage === 'tasks') t = 'tasks';
  openQuickCapture(t);
};
document.getElementById('quickCapture').addEventListener('click', e => {
  if (e.target.id === 'quickCapture') closeQuickCapture();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('modalOverlay').classList.contains('show')) closeModal();
    else if (document.getElementById('quickCapture').classList.contains('show')) closeQuickCapture();
    else if (document.getElementById('detailPanel').classList.contains('open')) closePanel();
  }
});

/* ============ 初始化 ============ */
initTheme();
setIdeaNavExpanded(false, false);
navigate('dashboard');
</script>
