<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>面试题库 · Study Desk</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<style>
/* ============================================================
   基础变量（会被 JS 注入的主题覆盖）
   ============================================================ */
:root{
  --bg:#F4F7F3; --surface:#FCFDFB; --surface2:#EDF2EE; --sidebar:#EAF0EB;
  --text:#2C3A33; --muted:#6E8076; --line:#D5E0D7;
  --accent:#5C7A6C; --accent-ink:#FFFFFF; --accent-soft:#E4EDE7; --accent-line:#C3D4C8;
  --hover:#EAF0EB; --focus-ring:#78948755;
  --ok:#5F8F6E; --ok-soft:#E2EEE4; --warn:#B08B4F; --warn-soft:#F4EAD6;
  --danger:#A85D63; --danger-soft:#F3E2E3;
  --radius:15px; --radius-sm:9px; --radius-lg:20px;
  --shadow:0 8px 28px #2C3A330F; --shadow-lg:0 16px 48px #2C3A3318;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#1B2320; --surface:#232C28; --surface2:#2B3531; --sidebar:#202824;
  --text:#EDF2EF; --muted:#A5B3AB; --line:#3A4741;
  --accent:#8FB3A3; --accent-ink:#15201B; --accent-soft:#2E3B34; --accent-line:#45564C;
  --hover:#2B3531; --focus-ring:#8FB3A355;
  --ok:#8FC79C; --ok-soft:#28382C; --warn:#E0BC7A; --warn-soft:#3A3220;
  --danger:#DFA2A6; --danger-soft:#3A282A;
  --shadow:0 8px 28px #0000004D; --shadow-lg:0 16px 48px #00000066;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.6 Inter,"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  transition:background .25s ease,color .25s ease;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
.icon{width:18px;height:18px;stroke:currentColor;stroke-width:1.75;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.icon.sm{width:15px;height:15px}
.icon.lg{width:22px;height:22px}

/* ===== 顶栏 ===== */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);
  backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--line)}
.topinner{max-width:1280px;margin:auto;padding:11px 24px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.brand{display:flex;gap:11px;align-items:center;min-width:0}
.brandmark{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;flex-shrink:0}
.brand h1{font-size:15px;margin:0;font-weight:750;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:10.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:3px;flex-wrap:wrap}
.nav button{color:var(--muted);padding:8px 11px;border-radius:var(--radius-sm);transition:.15s;
  display:inline-flex;align-items:center;gap:7px;font-size:13px}
.nav button:hover{background:var(--hover);color:var(--text)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav button svg{width:16px;height:16px}

.wrap{max-width:1280px;margin:auto;padding:26px 24px 90px}
.crumbs{font-size:12px;color:var(--muted);margin-bottom:14px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.crumbs a{color:var(--accent);text-decoration:none;cursor:pointer}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{opacity:.4}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:.16em;color:var(--accent);font-weight:800}
.pagehead h2{font-size:25px;letter-spacing:-.03em;margin:5px 0 3px;font-weight:760}
.pagehead p{margin:0;color:var(--muted);font-size:13px}

/* ===== 按钮 ===== */
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);
  padding:9px 13px;border-radius:var(--radius-sm);transition:.15s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:550}
.btn:hover{border-color:var(--accent-line);background:var(--hover);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:650}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,black);border-color:transparent}
.btn.subtle{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.subtle:hover{background:var(--accent-line);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.danger:hover{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.btn.ghost{border-color:transparent;color:var(--muted);background:transparent}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.small{padding:5px 9px;font-size:12px;gap:5px}
.btn.small svg{width:14px;height:14px}

/* ===== 卡片 ===== */
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);min-width:0;transition:.2s}
.card.stat{position:relative;overflow:hidden;cursor:pointer}
.card.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.9}
.card.stat.ok::before{background:var(--ok)}
.card.stat.warn::before{background:var(--warn)}
.card.stat.danger::before{background:var(--danger)}
.card.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.statrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.staticon{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;flex-shrink:0}
.staticon.ok{background:var(--ok-soft);color:var(--ok)}
.staticon.warn{background:var(--warn-soft);color:var(--warn)}
.staticon.danger{background:var(--danger-soft);color:var(--danger)}
.statlabel{font-size:12px;color:var(--muted);font-weight:600}
.statnum{font-size:29px;font-weight:760;letter-spacing:-.04em;margin-top:6px;font-variant-numeric:tabular-nums}
.statfoot{font-size:11px;color:var(--muted);margin-top:3px}

.columns{grid-template-columns:minmax(0,1.35fr) minmax(300px,.8fr)}
.sectiontitle{font-weight:750;font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.stack{display:grid;gap:10px}
.quickitem{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--line)}
.quickitem:last-child{border-bottom:0}
.quickitem strong{display:block;font-weight:650;font-size:13.5px}
.quickitem small{display:block;color:var(--muted);margin-top:3px;font-size:11.5px}

.field{display:grid;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:650}
.field input,.field select,.field textarea{width:100%;min-width:0;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius-sm);padding:9.5px 11px;color:var(--text);
  transition:.15s;font-size:13px}
.field input:hover,.field select:hover{border-color:var(--accent-line)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;
  box-shadow:0 0 0 3px var(--focus-ring)}
.field textarea{min-height:80px;resize:vertical;font-family:inherit}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.formgrid .full{grid-column:1/-1}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:end}
.toolbar .field{min-width:150px;flex:1}

/* ===== 搜索历史 ===== */
.searchbox{position:relative}
.history{position:absolute;top:100%;left:0;right:0;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);z-index:20;
  margin-top:4px;overflow:hidden;max-height:220px;overflow-y:auto}
.history .hitem{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;
  cursor:pointer;transition:.12s;border-bottom:1px solid var(--line)}
.history .hitem:last-child{border-bottom:0}
.history .hitem:hover{background:var(--hover)}
.history .hitem .hx{margin-left:auto;color:var(--muted);opacity:.6}
.history .hitem:hover .hx{opacity:1;color:var(--danger)}
.history .hclear{padding:8px 12px;text-align:center;font-size:12px;color:var(--muted);
  cursor:pointer;border-top:1px solid var(--line);transition:.12s}
.history .hclear:hover{background:var(--hover);color:var(--danger)}

/* ===== 表格 ===== */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:70vh;background:var(--surface)}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:840px}
th{text-align:left;background:var(--surface2);font-size:11px;letter-spacing:.05em;
  color:var(--muted);font-weight:750;position:sticky;top:0;z-index:1;text-transform:uppercase}
th.sortable{cursor:pointer;user-select:none;transition:.12s}
th.sortable:hover{color:var(--accent);background:var(--accent-soft)}
th.sortable .arrow{display:inline-block;margin-left:4px;opacity:.4;font-size:10px}
th.sortable.active .arrow{opacity:1;color:var(--accent)}
td,th{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--hover)}
tbody tr.selected{background:var(--accent-soft)}
.clickrow{cursor:pointer}
.checkcell{width:36px}
.checkcell input{accent-color:var(--accent);width:15px;height:15px}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 9px;
  background:var(--accent-soft);color:var(--accent);font-size:11px;margin:2px;font-weight:550;
  border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.line{background:transparent;border-color:var(--line);color:var(--muted)}

.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:30px;opacity:.3;margin-bottom:10px}
.empty strong{display:block;color:var(--text);font-weight:650;margin-bottom:4px;font-size:14px}
.empty .btn{margin-top:14px}

/* ===== Tabs / Panel ===== */
.tabs{display:flex;gap:3px;overflow:auto;border-bottom:1px solid var(--line);margin:20px 0 18px}
.tabs button{color:var(--muted);padding:10px 13px;border-bottom:2px solid transparent;
  white-space:nowrap;transition:.15s;font-size:13px}
.tabs button:hover{color:var(--text)}
.tabs button.active{color:var(--accent);border-color:var(--accent);font-weight:650}
.panel{display:none}
.panel.active{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== 富文本编辑器 ===== */
.editorgroup{display:grid;grid-template-columns:1fr;gap:18px}
.editorlabel{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.ql-toolbar.ql-snow{
  border-color:var(--line);
  border-radius:10px 10px 0 0;
  background:var(--surface2);
  padding:9px 10px;
  line-height:1.4;
}
.ql-container.ql-snow{
  border-color:var(--line);
  border-radius:0 0 10px 10px;
  font:14px/1.7 inherit;
  color:var(--text);
  background:var(--surface);
  height:auto;
}
.ql-editor{
  min-height:140px;
  overflow-wrap:anywhere;
  padding:12px 14px;
}
.ql-editor.ql-blank::before{color:var(--muted);font-style:normal}
/* 关键：让 Quill 内部的子元素不参与外层 grid/flex 拉伸 */
.ql-toolbar,.ql-container{display:block;position:relative}
.ql-toolbar *{box-sizing:border-box}
/* 保证编辑组每个子容器不因内容溢出影响布局 */
.editorgroup > div{min-width:0;display:block}  font:14px/1.7 inherit;color:var(--text);background:var(--surface)}
.ql-editor{min-height:160px;overflow-wrap:anywhere}
.ql-editor.ql-blank::before{color:var(--muted);font-style:normal}
.ql-snow .ql-stroke{stroke:var(--text)}
.ql-snow .ql-fill{fill:var(--text)}
.ql-snow .ql-picker{color:var(--text)}
.ql-snow .ql-picker-options{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.ql-snow .ql-picker.ql-size{width:86px}
.ql-snow .ql-picker.ql-size .ql-picker-label::before{content:'字号';}
.ql-snow .ql-picker.ql-size .ql-picker-item[data-value="small"]::before{font-size:12px}
.ql-snow .ql-picker.ql-size .ql-picker-item[data-value="large"]::before{font-size:18px}
.ql-snow .ql-picker.ql-size .ql-picker-item[data-value="huge"]::before{font-size:24px}

/* ===== 详情页分栏 ===== */
.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.detail-side{position:sticky;top:80px}
.side-item{display:flex;justify-content:space-between;gap:10px;padding:9px 0;
  border-bottom:1px dashed var(--line);font-size:12px}
.side-item:last-child{border-bottom:0}
.side-item .k{color:var(--muted)}
.side-item .v{font-weight:650;text-align:right}

/* ===== 术语卡 ===== */
.termgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.termcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface2);transition:.15s}
.termcard:hover{border-color:var(--accent-line)}
.termcard .field{margin-bottom:10px}
.termcard .field:last-of-type{margin-bottom:0}
.termhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hr{height:1px;background:var(--line);margin:20px 0}
.notice{padding:12px 14px;background:var(--accent-soft);border-radius:10px;color:var(--text);
  font-size:12px;line-height:1.6;border-left:3px solid var(--accent)}

/* ===== Toast / Modal ===== */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);
  color:var(--surface);padding:11px 17px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:60;
  max-width:90vw;animation:toastIn .25s;display:flex;align-items:center;gap:10px;font-size:13px}
.toast.ok{background:var(--ok);color:white}
.toast.err{background:var(--danger);color:white}
.toast .undo{border:1px solid currentColor;color:inherit;padding:3px 10px;border-radius:6px;
  font-size:12px;background:transparent;margin-left:8px;font-weight:650;transition:.15s}
.toast .undo:hover{background:white;color:var(--text)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

.modalback{position:fixed;inset:0;background:#00000055;backdrop-filter:blur(2px);z-index:50;
  display:grid;place-items:center;padding:18px;animation:fade .15s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;
  width:min(560px,100%);max-height:90vh;overflow:auto;animation:modalIn .2s;box-shadow:var(--shadow-lg)}
@keyframes modalIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 8px;font-size:17px}

/* ===== 分类 ===== */
.categoryrow,.projectrow{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.categoryrow:last-child,.projectrow:last-child{border-bottom:0}
.categoryrow strong,.projectrow strong{display:block}
.categoryrow small,.projectrow small{color:var(--muted)}
.settingsection{margin-bottom:18px}
.footerhint{font-size:11px;color:var(--muted);margin-top:20px;line-height:1.6}
.primary-category{background:linear-gradient(100deg,var(--accent-soft),transparent 88%);
  border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin:8px 0 5px}
.primary-category strong{font-weight:800;font-size:14px;color:var(--accent)}
.secondary-category{margin-left:12px;padding-top:10px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.secondary-category strong{font-size:13px;font-weight:500;color:var(--muted)}
.question-category-stack{display:inline-flex;flex-direction:column;gap:3px;align-items:flex-start}
.question-primary-category{display:inline-block;font-weight:750;font-size:12px;color:var(--accent);
  background:var(--accent-soft);padding:3px 7px;border-radius:6px}
.question-secondary-category{display:inline-block;font-size:11px;color:var(--muted);padding-left:5px}
.category-unassigned{font-size:12px;color:var(--muted)}

/* ===== 首页图表 ===== */
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ===== 热力图 ===== */
.heatwrap{overflow-x:auto;padding-bottom:6px}
.heatgrid{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px}
.heatcell{width:12px;height:12px;border-radius:3px;background:var(--surface2);transition:.12s;cursor:pointer}
.heatcell:hover{transform:scale(1.25)}
.heatcell.l1{background:color-mix(in srgb,var(--accent) 25%,var(--surface2))}
.heatcell.l2{background:color-mix(in srgb,var(--accent) 50%,var(--surface2))}
.heatcell.l3{background:color-mix(in srgb,var(--accent) 75%,var(--surface2))}
.heatcell.l4{background:var(--accent)}
.heatlegend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--muted);margin-top:10px;justify-content:flex-end}
.heatlegend .heatcell{width:11px;height:11px;cursor:default}
.heatlegend .heatcell:hover{transform:none}

/* ===== 统计页柱状图 ===== */
.barchart{display:flex;align-items:flex-end;gap:6px;height:160px;padding:8px 0;
  border-bottom:1px solid var(--line)}
.barchart .bcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;position:relative}
.barchart .bcol .bval{font-size:10px;color:var(--muted);font-weight:650}
.barchart .bcol .bar-fill{width:100%;border-radius:6px 6px 0 0;background:var(--accent);transition:.3s;min-height:2px}
.barchart .bcol .blabel{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap}
.barchart .bcol:hover .bar-fill{background:var(--accent2,var(--accent));filter:brightness(1.05)}

/* ===== 闪卡 ===== */
.flashcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;
  box-shadow:var(--shadow);max-width:820px;margin:auto}
.flash-q{font-size:21px;font-weight:750;letter-spacing:-.02em;line-height:1.4;margin:10px 0 6px}
.flash-cat{font-size:12px;color:var(--muted)}
.flash-answer{margin-top:18px;padding:16px;border-radius:12px;background:var(--surface2);
  border:1px solid var(--line);max-height:420px;overflow:auto}
.flash-answer img{max-width:100%}
.grade-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.grade-btn{flex:1;min-width:120px;border:1px solid var(--line);background:var(--surface);
  border-radius:12px;padding:14px;text-align:center;transition:.15s}
.grade-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
.grade-btn strong{display:block;font-size:14px}
.grade-btn small{color:var(--muted);font-size:11px}
.grade-btn.forgot:hover{border-color:var(--danger);background:var(--danger-soft)}
.grade-btn.vague:hover{border-color:var(--warn);background:var(--warn-soft)}
.grade-btn.good:hover{border-color:var(--ok);background:var(--ok-soft)}

/* ===== 主题选择器 ===== */
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:14px}
.themecard{border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;
  transition:.18s;background:var(--surface);position:relative}
.themecard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}

.themecard .swatches{display:flex;gap:4px;margin-bottom:10px}
.themecard .swatches i{width:100%;height:26px;border-radius:6px}
.themecard .name{font-size:12.5px;font-weight:700;margin-bottom:3px}
.themecard .desc{font-size:11px;color:var(--muted)}
.themecard .check{position:absolute;top:10px;right:10px;width:20px;height:20px;
  border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center}
.themecard.active .check{display:grid}

.modeswitch{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--line)}
.modeswitch button{padding:6px 12px;border-radius:7px;font-size:12px;color:var(--muted);
  transition:.15s;display:inline-flex;align-items:center;gap:5px}
.modeswitch button.active{background:var(--surface);color:var(--text);font-weight:650;box-shadow:var(--shadow)}

/* ===== 打印视图 ===== */
@media print{
  .topbar,.no-print{display:none!important}
  body{background:white;color:black;font-size:11.5pt}
  .printpage{max-width:100%;padding:0}
  .printblock{page-break-inside:avoid;margin-bottom:18px;border-bottom:1px solid #ddd;padding-bottom:14px}
  .printblock h3{margin:0 0 6px;font-size:13pt}
  .printblock .meta{color:#666;font-size:9.5pt;margin-bottom:8px}
  .printblock .ans{margin:6px 0;line-height:1.7}
  .printblock .ans b{display:block;font-size:9.5pt;color:#666;margin-bottom:2px}
}
.printpage{max-width:900px;margin:auto}
.printtoolbar{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line);
  padding:12px 24px;display:flex;gap:10px;align-items:center;justify-content:space-between;margin:-26px -24px 22px}
.printblock{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.printblock h3{margin:0 0 6px;font-size:15px;font-weight:700}
.printblock .meta{color:var(--muted);font-size:11.5px;margin-bottom:10px}
.printblock .ans{margin:8px 0;line-height:1.7;font-size:13.5px}
.printblock .ans b{display:block;font-size:11.5px;color:var(--muted);font-weight:650;margin-bottom:3px}
.printgroup h2{font-size:16px;font-weight:750;margin:22px 0 12px;padding-bottom:8px;border-bottom:2px solid var(--accent)}

/* ===== 移动端 ===== */
@media(max-width:960px){
  .detail-layout{grid-template-columns:1fr}
  .detail-side{position:static}

}
@media(max-width:850px){

  .toast{bottom:80px}
  .printtoolbar{margin:-20px -16px 16px;padding:10px 16px}
}
.hide{display:none!important}

  }));

}

function notify(msg,type='ok',undoFn=null){
  const root=document.getElementById('toastroot');
  const icon=type==='err'
    ? '<svg class="icon sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
    : '<svg class="icon sm" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>';
  const undoBtn=undoFn?'<button class="undo" id="undoBtn">撤销</button>':'';
  root.innerHTML=`<div class="toast ${type}">${icon}<span>${esc(msg)}</span>${undoBtn}</div>`;
  clearTimeout(toastTimer);
  if(undoFn){document.getElementById('undoBtn').onclick=()=>{root.innerHTML='';undoFn()}}
  toastTimer=setTimeout(()=>root.innerHTML='',undoFn?8000:2800);
}
function allCats(){let a=[];for(const c of db.categories){a.push({id:c.id,name:c.name,parent:null});for(const x of c.children||[])a.push({id:x.id,name:x.name,parent:c.id})}return a}

function categoryMarkup(id){
  const found=allCats().find(c=>c.id===id);

  if(!found.parent)return `<span class="question-primary-category">${esc(found.name)}</span>`;

}

function download(name,content,type){

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function exportMarkdown(){
  const lines=['# 面试题库导出','',`> 导出时间：${new Date().toLocaleString()}｜共 ${db.questions.length} 题`,''];
  const byCat={};
  db.questions.forEach(q=>{const k=catName(q.categoryId);(byCat[k]=byCat[k]||[]).push(q)});
  for(const cat in byCat){
    lines.push(`## ${cat}`,'');
    byCat[cat].forEach(q=>{
      lines.push(`### ${q.title}`,'');
      lines.push(`- 掌握程度：${q.masterLevel}`);
      lines.push(`- 重要度：${q.important}/5｜难度：${q.difficulty}/5`);
      lines.push(`- 项目：${q.projectTags.map(id=>db.projects.find(p=>p.id===id)?.name).filter(Boolean).join('、')||'—'}`);
      if(q.note)lines.push(`- 备注：${q.note}`);
      lines.push('');
      if(q.answerMy.zh){lines.push('**我的回答（中文）**','',stripHtml(q.answerMy.zh),'')}
      if(q.answerMy.en){lines.push('**My Answer (EN)**','',stripHtml(q.answerMy.en),'')}
      if(q.answerOpt.zh){lines.push('**优化回答**','',stripHtml(q.answerOpt.zh),'')}
      if(q.answerExt.zh){lines.push('**扩展回答**','',stripHtml(q.answerExt.zh),'')}

        q.terms.forEach(t=>lines.push(`| ${t.zh||''} | ${t.en||''} | ${(t.expZh||'').replace(/\n/g,' ')} |`));

    });

}
function restore(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=()=>{
    const f=i.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const incoming=normalize(JSON.parse(r.result));
        const mode=confirm('导入方式\n\n点「确定」= 覆盖当前数据\n点「取消」= 与当前数据合并');
        if(mode){db=incoming}
        else{
          const map=new Map(db.questions.map(q=>[q.title+'|'+q.categoryId,q]));
          incoming.questions.forEach(q=>map.set(q.title+'|'+q.categoryId,q));
          db.questions=[...map.values()];
          const pmap=new Map(db.projects.map(p=>[p.name,p]));
          incoming.projects.forEach(p=>pmap.set(p.name,p));
          db.projects=[...pmap.values()];
        }
        save();render();notify('导入成功');
      }catch(e){notify('文件不是有效的 JSON 备份','err')}
    };
    r.readAsText(f);
  };i.click();
}

/* ---------- 题库 ---------- */
function bankView(){
  let qs=[...db.questions];
  if(filter.search){
    const kw=filter.search.toLowerCase();
    qs=qs.filter(q=>{
      const hay=[q.title,q.note,stripHtml(q.answerMy.zh),stripHtml(q.answerMy.en),stripHtml(q.answerOpt.zh),stripHtml(q.answerExt.zh),...(q.terms||[]).flatMap(t=>[t.zh,t.en,t.expZh,t.expEn])].join(' ').toLowerCase();
      return hay.includes(kw);
    });
  }
  if(filter.project)qs=qs.filter(q=>(q.projectTags||[]).includes(filter.project));
  if(filter.category)qs=qs.filter(q=>q.categoryId===filter.category);
  if(filter.level)qs=qs.filter(q=>q.masterLevel===filter.level);
  if(filter.starred)qs=qs.filter(q=>q.starred);
  if(filter.view==='today')qs=qs.filter(q=>q.nextReviewAt&&q.nextReviewAt.slice(0,10)===todayStr());
  if(filter.view==='overdue')qs=qs.filter(q=>q.nextReviewAt&&new Date(q.nextReviewAt)<new Date(todayStr()));
  // 排序
  const dir=filter.sortDir==='asc'?1:-1;
  const cmp={
    default:(a,b)=>(b.starred?1:0)-(a.starred?1:0)||(b.important||0)-(a.important||0),
    important:(a,b)=>((a.important||0)-(b.important||0))*dir,
    difficulty:(a,b)=>((a.difficulty||0)-(b.difficulty||0))*dir,
    reviews:(a,b)=>((a.reviewCount||0)-(b.reviewCount||0))*dir,
    created:(a,b)=>(new Date(a.createdAt)-new Date(b.createdAt))*dir,
    modified:(a,b)=>(new Date(a.modifiedAt)-new Date(b.modifiedAt))*dir,
    next:(a,b)=>{const av=a.nextReviewAt?new Date(a.nextReviewAt).getTime():Infinity;const bv=b.nextReviewAt?new Date(b.nextReviewAt).getTime():Infinity;return (av-bv)*dir},
    title:(a,b)=>a.title.localeCompare(b.title,'zh')*dir
  };
  qs.sort(cmp[filter.sort]||cmp.default);
  const allSelected=qs.length>0&&qs.every(q=>selectedIds.has(q.id));
  const sortOpts=[['default','默认（收藏→重要度）'],['important','重要度'],['difficulty','难度'],['reviews','复习次数'],['created','创建时间'],['modified','修改时间'],['next','下次复习'],['title','标题']];

  return `${topHead('QUESTION LIBRARY','题库列表','搜索、筛选并打开题目，持续迭代你的回答。',
      `<button class="btn primary" id="newQ">${I.plus}新建题目</button>`,
      `<a data-goto="home">总览</a><span class="sep">/</span><span>题库</span>`)}
  <section class="card">
    <div class="toolbar">
      <div class="field" style="flex:2">
        <label>搜索（标题·备注·答案·术语）</label>
        <div class="searchbox">
          <input id="searchFilter" value="${esc(filter.search)}" placeholder="输入关键词…" autocomplete="off">
          ${searchHistoryOpen&&db.searchHistory.length?`<div class="history" id="searchHistory">
            ${db.searchHistory.map(kw=>`<div class="hitem" data-kw="${esc(kw)}">${I.history}<span>${esc(kw)}</span><span class="hx" data-rm="${esc(kw)}">${I.x}</span></div>`).join('')}
            <div class="hclear" id="clearHistory">清空搜索历史</div>
          </div>`:''}
        </div>
      </div>
      <div class="field"><label>申请项目</label>
        <select id="projectFilter"><option value="">全部项目</option>${db.projects.map(p=>`<option value="${p.id}" ${filter.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>题目分类</label>
        <select id="categoryFilter"><option value="">全部分类</option>${allCats().map(c=>`<option value="${c.id}" ${filter.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>掌握程度</label>
        <select id="levelFilter"><option value="">全部</option>${LEVELS.map(l=>`<option ${filter.level===l?'selected':''}>${l}</option>`).join('')}</select>
      </div>
      <div class="field"><label>快速视图</label>
        <select id="viewFilter">
          <option value="all">全部题目</option>
          <option value="today" ${filter.view==='today'?'selected':''}>今日待复习</option>
          <option value="overdue" ${filter.view==='overdue'?'selected':''}>已逾期</option>
        </select>
      </div>
      <div class="field"><label>排序</label>
        <select id="sortFilter">${sortOpts.map(([v,t])=>`<option value="${v}" ${filter.sort===v?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div class="field" style="min-width:auto;flex:0 0 auto">
        <label>收藏</label>
        <button class="btn ${filter.starred?'primary':''}" id="starFilter">${filter.starred?I.starFill:I.star} 只看收藏</button>
      </div>
    </div>
  </section>

  ${selectedIds.size>0?`
  <section class="card" style="margin-top:14px;border-color:var(--accent-line);background:var(--accent-soft)">
    <div class="row" style="flex-wrap:wrap;gap:10px">
      <strong>已选 ${selectedIds.size} 题</strong>
      <button class="btn small" id="batchStar">${I.star} 收藏</button>
      <button class="btn small" id="batchUnstar">取消收藏</button>
      <button class="btn small" id="batchCategory">改分类</button>
      <button class="btn small" id="batchLevel">改掌握度</button>
      <button class="btn small danger" id="batchDelete">${I.trash} 删除</button>
      <button class="btn small ghost" id="clearSel">清除选择</button>
    </div>
  </section>`:''}

  <section class="card" style="margin-top:16px">
    <div class="row between" style="margin-bottom:13px">
      <h3 class="sectiontitle" style="margin:0">题目清单</h3>
      <span class="muted">${qs.length} 道题</span>
    </div>
    ${qs.length?`
      <div class="tablewrap"><table>
        <thead><tr>
          <th class="checkcell"><input type="checkbox" id="selectAll" ${allSelected?'checked':''}></th>
          <th class="sortable ${filter.sort==='title'?'active':''}" data-sort="title">题目 <span class="arrow">${filter.sort==='title'?(filter.sortDir==='asc'?'▲':'▼'):'⇅'}</span></th>
          <th>分类</th><th>关联项目</th>
          <th class="sortable ${filter.sort==='important'?'active':''}" data-sort="important">重要度 <span class="arrow">${filter.sort==='important'?(filter.sortDir==='asc'?'▲':'▼'):'⇅'}</span></th>
          <th>掌握程度</th>
          <th class="sortable ${filter.sort==='next'?'active':''}" data-sort="next">下次复习 <span class="arrow">${filter.sort==='next'?(filter.sortDir==='asc'?'▲':'▼'):'⇅'}</span></th>
        </tr></thead>
        <tbody>${qs.map(q=>{
          const next=q.nextReviewAt?new Date(q.nextReviewAt):null;
          const dLeft=next?daysBetween(new Date(),next):null;
          let nextCls='line',nextTxt='—';
          if(next){
            nextTxt=next.toLocaleDateString('zh-CN');
            if(dLeft<0){nextCls='danger';nextTxt+=' (逾期)'}
            else if(dLeft===0){nextCls='warn';nextTxt='今天'}
            else if(dLeft<=3){nextCls='warn';nextTxt+=` (${dLeft}天)`}
            else{nextCls='ok'}
          }
          return `<tr class="clickrow ${selectedIds.has(q.id)?'selected':''}" data-open="${q.id}">
            <td class="checkcell" onclick="event.stopPropagation()"><input type="checkbox" class="rowCheck" data-id="${q.id}" ${selectedIds.has(q.id)?'checked':''}></td>
            <td>
              <div class="row" style="gap:6px">${q.starred?`<span style="color:var(--warn)" title="已收藏">${I.starFill}</span>`:''}<strong>${esc(q.title)}</strong></div>
              <div class="muted" style="font-size:11px;margin-top:3px">${q.reviewCount||0} 次复习</div>
            </td>
            <td>${categoryMarkup(q.categoryId)}</td>
            <td>${(q.projectTags||[]).map(id=>`<span class="pill">${esc(db.projects.find(p=>p.id===id)?.name||'已删除')}</span>`).join('')||'—'}</td>
            <td><span class="pill line">${q.important||3}/5</span></td>
            <td><span class="pill">${esc(q.masterLevel)}</span></td>
            <td><span class="pill ${nextCls}">${nextTxt}</span></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`:`
      <div class="empty">
        <div class="big">${I.search}</div>
        <strong>没有符合条件的题目</strong>
        <div>试试调整筛选条件，或新建一道题。</div>
      </div>`}
  </section>`;
}

/* ---------- 详情 ---------- */
function detailView(){
  const q=qget();
  if(!q)return `${topHead('QUESTION','题目不存在','该题目可能已被删除。')}<button class="btn" data-goto="bank">${I.arrowLeft}返回题库</button>`;
  const next=q.nextReviewAt?new Date(q.nextReviewAt):null;
  return `${topHead('QUESTION DETAIL','编辑面试题目','回答内容支持字号、加粗和文字颜色，保存后会保留格式。',
      `<div class="row"><button class="btn" data-goto="bank">${I.arrowLeft}返回题库</button><button class="btn danger" id="deleteQ">${I.trash}删除</button></div>`,
      `<a data-goto="home">总览</a><span class="sep">/</span><a data-goto="bank">题库</a><span class="sep">/</span><span>${esc(q.title)}</span>`)}
  <div class="detail-layout">
    <div>
      <section class="card">
        <div class="formgrid">
          <div class="field full"><label>题目名称</label><input id="qTitle" value="${esc(q.title)}" placeholder="输入面试题目"></div>
          <div class="field"><label>所属分类</label><select id="qCategory"><option value="">未分类</option>${allCats().map(c=>`<option value="${c.id}" ${q.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
          <div class="field"><label>掌握程度</label><select id="qLevel">${LEVELS.map(l=>`<option ${q.masterLevel===l?'selected':''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label>重要程度（1–5）</label><select id="qImportant">${[1,2,3,4,5].map(n=>`<option ${q.important===n?'selected':''}>${n}</option>`).join('')}</select></div>
          <div class="field"><label>难度（1–5）</label><select id="qDifficulty">${[1,2,3,4,5].map(n=>`<option ${q.difficulty===n?'selected':''}>${n}</option>`).join('')}</select></div>
          <div class="field"><label>下次复习日期</label><input type="date" id="qNext" value="${q.nextReviewAt?esc(q.nextReviewAt.slice(0,10)):''}"></div>
          <div class="field"><label>学习备注</label><input id="qNote" value="${esc(q.note||'')}" placeholder="例如：需补充实证识别策略"></div>
          <div class="field full"><label>关联申请项目（可多选）</label>
            <div class="row" style="flex-wrap:wrap;gap:8px">
              ${db.projects.map(p=>`<label class="pill" style="padding:7px 10px;cursor:pointer"><input type="checkbox" class="qProject" value="${p.id}" ${(q.projectTags||[]).includes(p.id)?'checked':''} style="accent-color:var(--accent)"> ${esc(p.name)}</label>`).join('')||'<span class="muted">请先新增申请项目</span>'}
            </div>
          </div>
        </div>
        <div class="row between" style="margin-top:18px;flex-wrap:wrap;gap:10px">
          <div class="muted" style="font-size:12px">复习 ${q.reviewCount||0} 次${q.lastReviewAt?' · 上次：'+fmtDate(q.lastReviewAt):''}</div>
          <div class="row" style="gap:8px">
            <button class="btn small" id="toggleStar">${q.starred?I.starFill:I.star} ${q.starred?'取消收藏':'收藏'}</button>
            <button class="btn small" id="duplicateQ">${I.copy}复制</button>
            <button class="btn" id="reviewBtn">${I.check}完成本次复习</button>
          </div>
        </div>
        <div class="tabs">
          <button class="active" data-tab="my">我的回答</button>

          <div><div class="editorlabel">我的回答 · 中文</div><div id="ed-my-zh"></div></div>
          <div><div class="editorlabel">My Answer · English</div><div id="ed-my-en"></div></div>
        </div></div>
        <div class="panel" id="panel-opt"><div class="editorgroup">
          <div><div class="editorlabel">优化回答 · 中文</div><div id="ed-opt-zh"></div></div>
          <div><div class="editorlabel">Optimized Answer · English</div><div id="ed-opt-en"></div></div>
        </div></div>
        <div class="panel" id="panel-ext"><div class="editorgroup">
          <div><div class="editorlabel">扩展回答 · 中文</div><div id="ed-ext-zh"></div></div>
          <div><div class="editorlabel">Extended Answer · English</div><div id="ed-ext-en"></div></div>
        </div></div>
        <div class="panel" id="panel-terms">
          <div class="row between" style="margin-bottom:14px;flex-wrap:wrap;gap:10px">
            <div><h3 class="sectiontitle" style="margin:0 0 3px">英文术语表</h3><div class="muted" style="font-size:12px">点击输入框直接编辑；修改后请点击“保存全部修改”。</div></div>
            <div class="row" style="gap:8px">
              <input id="termSearch" placeholder="搜索术语…" style="width:150px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:12px">
              <button class="btn subtle" id="addTerm">${I.plus}添加术语</button>
            </div>
          </div>
          <div id="termsArea">${termsView(q)}</div>
        </div>
        <div class="hr"></div>
        <div class="row between" style="flex-wrap:wrap;gap:10px">
          <span class="muted" style="font-size:12px">最后修改：${q.modifiedAt?new Date(q.modifiedAt).toLocaleString('zh-CN'):'—'}</span>
          <button class="btn primary" id="saveQ">${I.check}保存全部修改</button>

      </section>
    </div>
    <aside class="card detail-side">
      <h3 class="sectiontitle">${I.layers}题目信息</h3>
      <div class="side-item"><span class="k">分类</span><span class="v">${catName(q.categoryId)}</span></div>
      <div class="side-item"><span class="k">掌握程度</span><span class="v">${esc(q.masterLevel)}</span></div>
      <div class="side-item"><span class="k">重要度</span><span class="v">${q.important||3} / 5</span></div>
      <div class="side-item"><span class="k">难度</span><span class="v">${q.difficulty||3} / 5</span></div>
      <div class="side-item"><span class="k">复习次数</span><span class="v">${q.reviewCount||0}</span></div>
      <div class="side-item"><span class="k">下次复习</span><span class="v">${next?fmtDate(next):'—'}</span></div>
      <div class="side-item"><span class="k">创建</span><span class="v">${fmtDate(q.createdAt)}</span></div>
      <div class="side-item"><span class="k">修改</span><span class="v">${fmtDate(q.modifiedAt)}</span></div>
      <div class="side-item"><span class="k">术语</span><span class="v">${q.terms.length} 条</span></div>
      <div class="hr"></div>
      <div class="stack"><button class="btn small" id="nextQ">${I.chevron}下一题</button></div>
    </aside>
  </div>`;
}

function termsView(q,kw=''){
  let terms=q.terms;
  if(kw){const k=kw.toLowerCase();terms=terms.filter(t=>[t.zh,t.en,t.expZh,t.expEn].join(' ').toLowerCase().includes(k))}
  if(!q.terms.length)return '<div class="empty"><div class="big">'+I.tag+'</div><strong>还没有术语</strong><div>点击“添加术语”创建第一条。</div></div>';
  if(!terms.length)return '<div class="empty">没有匹配的术语。</div>';
  return `<div class="termgrid">${terms.map(t=>{
    const i=q.terms.indexOf(t);
    return `<div class="termcard" data-term="${t.id}">
      <div class="termhead"><strong>术语 ${i+1}</strong><button class="btn small danger removeTerm" data-id="${t.id}">${I.trash}</button></div>
      <div class="field"><label>中文术语</label><input data-tfield="zh" value="${esc(t.zh)}" placeholder="例如：机会成本"></div>
      <div class="field"><label>英文术语</label><input data-tfield="en" value="${esc(t.en)}" placeholder="e.g. Opportunity Cost"></div>
      <div class="field"><label>术语中文解释</label><textarea data-tfield="expZh" placeholder="输入中文解释">${esc(t.expZh)}</textarea></div>
      <div class="field"><label>术语英文解释</label><textarea data-tfield="expEn" placeholder="Enter an English explanation">${esc(t.expEn)}</textarea></div>
    </div>`;
  }).join('')}</div>`;
}

/* ---------- 自测 ---------- */
function practiceView(){
  const allPool=db.questions.filter(q=>stripHtml(q.answerMy.zh)||stripHtml(q.answerMy.en));
  if(!allPool.length){
    return `${topHead('FLASHCARD PRACTICE','自测','随机抽题、隐藏答案、自评掌握度。','',`<a data-goto="home">总览</a><span class="sep">/</span><span>自测</span>`)}
      <div class="card empty"><div class="big">${I.spark}</div><strong>还没有可自测的题目</strong><div>请先为题目填写“我的回答”内容。</div><button class="btn primary" data-goto="bank">${I.arrowLeft}去题库</button></div>`;
  }
  if(!practiceState){
    // 配置页
    let pool=allPool.filter(q=>{
      if(practiceConfig.category&&q.categoryId!==practiceConfig.category)return false;
      if(practiceConfig.project&&!(q.projectTags||[]).includes(practiceConfig.project))return false;
      if(practiceConfig.level&&q.masterLevel!==practiceConfig.level)return false;
      if(practiceConfig.view==='overdue'&&!(q.nextReviewAt&&new Date(q.nextReviewAt)<new Date()))return false;
      if(practiceConfig.view==='starred'&&!q.starred)return false;
      return true;
    });
    return `${topHead('FLASHCARD PRACTICE','自测','先设定复习范围，再开始随机抽题。','',`<a data-goto="home">总览</a><span class="sep">/</span><span>自测</span>`)}
    <section class="card" style="max-width:720px;margin:auto">
      <h3 class="sectiontitle">${I.spark}复习范围</h3>
      <div class="formgrid">
        <div class="field"><label>按分类（可选）</label>
          <select id="pCategory"><option value="">全部分类</option>${allCats().map(c=>`<option value="${c.id}" ${practiceConfig.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>按项目（可选）</label>
          <select id="pProject"><option value="">全部项目</option>${db.projects.map(p=>`<option value="${p.id}" ${practiceConfig.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
        </div>
        <div class="field"><label>按掌握程度（可选）</label>
          <select id="pLevel"><option value="">全部</option>${LEVELS.map(l=>`<option ${practiceConfig.level===l?'selected':''}>${l}</option>`).join('')}</select>
        </div>
        <div class="field"><label>快速视图</label>
          <select id="pView">
            <option value="all">全部</option>
            <option value="overdue" ${practiceConfig.view==='overdue'?'selected':''}>只看逾期</option>
            <option value="starred" ${practiceConfig.view==='starred'?'selected':''}>只看收藏</option>
          </select>
        </div>
        <div class="field full"><label>每轮题数</label>
          <select id="pCount">
            <option value="10" ${practiceConfig.count==10?'selected':''}>10 题</option>
            <option value="20" ${practiceConfig.count==20?'selected':''}>20 题</option>
            <option value="30" ${practiceConfig.count==30?'selected':''}>30 题</option>
            <option value="0" ${practiceConfig.count===0?'selected':''}>全部（${pool.length} 题）</option>
          </select>
        </div>
      </div>
      <div class="notice" style="margin-top:16px">符合条件：<strong>${pool.length}</strong> 道题。${pool.length?'':'（请调整筛选条件）'}</div>
      <div class="row" style="margin-top:16px;justify-content:flex-end">
        <button class="btn primary" id="startPractice" ${pool.length?'':'disabled'}>${I.spark}开始自测</button>
      </div>
    </section>`;
  }
  // 卡片
  const id=practiceState.order[practiceState.idx];
  const q=db.questions.find(x=>x.id===id)||allPool[0];
  const cat=catName(q.categoryId);
  return `${topHead('FLASHCARD PRACTICE','自测','随机抽题、隐藏答案、自评掌握度。',
    `<div class="row" style="gap:8px">
      <span class="pill line">第 ${practiceState.idx+1} / ${practiceState.total} 题 · 第 ${practiceState.round} 轮</span>
      <button class="btn small" id="endPractice">${I.x}结束</button>
      <button class="btn small" id="reshuffle">${I.refresh}重新洗牌</button>
    </div>`,
    `<a data-goto="home">总览</a><span class="sep">/</span><span>自测</span>`)}
  <div class="flashcard">
    <div class="flash-cat">${cat}${q.starred?' · ★':''}</div>
    <div class="flash-q">${esc(q.title)}</div>
    ${practiceState.revealed?`
      <div class="flash-answer">
        ${stripHtml(q.answerMy.zh)?`<div style="margin-bottom:12px"><strong style="font-size:12px;color:var(--muted)">我的回答（中文）</strong><div>${q.answerMy.zh}</div></div>`:''}
        ${stripHtml(q.answerMy.en)?`<div><strong style="font-size:12px;color:var(--muted)">My Answer (EN)</strong><div>${q.answerMy.en}</div></div>`:''}
      </div>
      <div class="grade-row">
        <button class="grade-btn forgot" data-grade="forgot"><strong>忘记 <kbd style="font-size:10px;opacity:.6">1</kbd></strong><small>明后天再练</small></button>
        <button class="grade-btn vague" data-grade="vague"><strong>模糊 <kbd style="font-size:10px;opacity:.6">2</kbd></strong><small>3 天后再练</small></button>
        <button class="grade-btn good" data-grade="good"><strong>记得 <kbd style="font-size:10px;opacity:.6">3</kbd></strong><small>间隔拉长</small></button>
      </div>`:`
      <div class="grade-row"><button class="btn primary" id="reveal" style="flex:1;justify-content:center">${I.spark}显示答案 <kbd style="font-size:10px;opacity:.7">空格</kbd></button></div>`}
    <div class="hr"></div>
    <div class="row between">
      <button class="btn ghost" id="prevCard">${I.arrowLeft}上一题</button>
      <button class="btn ghost" id="skipCard">跳过 ${I.chevron}</button>
    </div>
  </div>`;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- 统计页 ---------- */
function statsView(){
  const qs=db.questions;
  // 热力图：最近 26 周
  const today=new Date();today.setHours(0,0,0,0);
  // 找到本周的周日
  const startOfWeek=new Date(today);startOfWeek.setDate(today.getDate()-today.getDay());
  const weeks=26;
  const heatStart=new Date(startOfWeek);heatStart.setDate(startOfWeek.getDate()-(weeks-1)*7);
  // 复习记录按天统计（用 modifiedAt 近似；更精确可以用 lastReviewAt，但只有最后一次）
  const dayCount={};
  qs.forEach(q=>{
    if(q.lastReviewAt){const k=new Date(q.lastReviewAt).toISOString().slice(0,10);dayCount[k]=(dayCount[k]||0)+1}
  });
  // 生成热力图 grid（行=一周7天，列=周）
  const cells=[];
  let maxCount=0;
  for(let w=0;w<weeks;w++){
    for(let d=0;d<7;d++){
      const cur=new Date(heatStart);cur.setDate(heatStart.getDate()+w*7+d);
      if(cur>today){cells.push(null);continue}
      const k=cur.toISOString().slice(0,10);
      const v=dayCount[k]||0;maxCount=Math.max(maxCount,v);
      const lv=v===0?0:v<=1?1:v<=3?2:v<=6?3:4;
      cells.push({date:cur,key:k,count:v,lv});
    }
  }
  const heatHtml=cells.map(c=>{
    if(!c)return '<div class="heatcell" style="visibility:hidden"></div>';
    return `<div class="heatcell ${c.lv?'l'+c.lv:''}" title="${c.key}：复习 ${c.count} 题"></div>`;
  }).join('');
  // 每周趋势：最近 12 周
  const weeksTrend=[];
  for(let w=weeks-12;w<weeks;w++){
    let sum=0;
    for(let d=0;d<7;d++){
      const cur=new Date(heatStart);cur.setDate(heatStart.getDate()+w*7+d);
      if(cur>today)continue;
      const k=cur.toISOString().slice(0,10);
      sum+=dayCount[k]||0;
    }
    const wkStart=new Date(heatStart);wkStart.setDate(heatStart.getDate()+w*7);
    weeksTrend.push({label:`${wkStart.getMonth()+1}/${wkStart.getDate()}`,value:sum});
  }
  const maxWeek=Math.max(1,...weeksTrend.map(x=>x.value));
  const barHtml=weeksTrend.map(x=>`
    <div class="bcol" title="${x.label}：${x.value} 题">
      <div class="bval">${x.value||''}</div>
      <div class="bar-fill" style="height:${Math.round(x.value/maxWeek*100)}%"></div>
      <div class="blabel">${x.label}</div>
    </div>`).join('');
  // 分类掌握分布
  const catStats=db.categories.map(c=>{
    const subIds=[c.id,...(c.children||[]).map(s=>s.id)];
    const inCat=qs.filter(q=>subIds.includes(q.categoryId));
    const mastered=inCat.filter(q=>q.masterLevel==='熟练'||q.masterLevel==='基本掌握').length;
    return {name:c.name,total:inCat.length,mastered,pct:inCat.length?Math.round(mastered/inCat.length*100):0};
  });
  // 项目覆盖
  const projStats=db.projects.map(p=>({name:p.name,count:qs.filter(q=>(q.projectTags||[]).includes(p.id)).length}));
  const maxProj=Math.max(1,...projStats.map(x=>x.count));

  return `${topHead('PROGRESS & STATS','统计与热力图','看见你坚持了多久、哪些分类该补、哪些项目覆盖不足。',
    `<button class="btn" id="printBtn">${I.printer}打印视图</button>`,
    `<a data-goto="home">总览</a><span class="sep">/</span><span>统计</span>`)}
  <section class="card" style="margin-bottom:16px">
    <h3 class="sectiontitle">${I.clock}复习热力图（最近 26 周）</h3>
    <div class="heatwrap"><div class="heatgrid">${heatHtml}</div></div>
    <div class="heatlegend">
      <span>少</span>
      <div class="heatcell"></div>
      <div class="heatcell l1"></div>
      <div class="heatcell l2"></div>
      <div class="heatcell l3"></div>
      <div class="heatcell l4"></div>
      <span>多</span>
    </div>
  </section>
  <div class="grid columns">
    <section class="card">
      <h3 class="sectiontitle">${I.chart}每周复习趋势（最近 12 周）</h3>
      <div class="barchart">${barHtml}</div>
    </section>
    <section class="card">
      <h3 class="sectiontitle">${I.layers}分类掌握分布</h3>
      ${catStats.map(c=>`
        <div style="margin-bottom:12px">
          <div class="row between" style="font-size:12.5px"><span><strong>${esc(c.name)}</strong></span><span class="muted">${c.mastered}/${c.total} · ${c.pct}%</span></div>
          <div class="bar"><i style="width:${c.pct}%"></i></div>
        </div>`).join('')}
    </section>
  </div>
  <section class="card" style="margin-top:16px">
    <h3 class="sectiontitle">${I.folder}项目覆盖分布</h3>
    ${projStats.map(p=>`
      <div style="margin-bottom:12px">
        <div class="row between" style="font-size:12.5px"><span>${esc(p.name)}</span><span class="muted">${p.count} 题</span></div>
        <div class="bar"><i style="width:${Math.round(p.count/maxProj*100)}%"></i></div>
      </div>`).join('')}
  </section>`;
}

/* ============================================================
   事件绑定
   ============================================================ */
function bind(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=(e)=>{
    if(e.target.closest('button:not([data-goto])'))return;
    go(b.dataset.goto);
  });
  document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=(e)=>{
    if(e.target.closest('input,button,a,label'))return;
    currentId=b.dataset.open;page='detail';dirty=false;render();window.scrollTo(0,0);
  });
  const nb=document.getElementById('newQ');if(nb)nb.onclick=newQuestion;
  const nb2=document.getElementById('newQ2');if(nb2)nb2.onclick=newQuestion;
  const gp=document.getElementById('goPractice');if(gp)gp.onclick=()=>{practiceState=null;go('practice')};

  if(page==='bank')bindBank();
  if(page==='detail')bindDetail();
  if(page==='practice')bindPractice();
  if(page==='stats')bindStats();
  if(page==='projects')bindProjects();
  if(page==='categories')bindCategories();
  if(page==='settings')bindSettings();
}

function newQuestion(){
  const q={id:uid(),title:'新面试题目',categoryId:null,projectTags:[],important:3,difficulty:3,masterLevel:'未学习',starred:false,createdAt:new Date().toISOString(),modifiedAt:new Date().toISOString(),reviewCount:0,lastReviewAt:null,nextReviewAt:null,note:'',answerMy:{zh:'',en:''},answerOpt:{zh:'',en:''},answerExt:{zh:'',en:''},terms:[]};
  db.questions.unshift(q);save();currentId=q.id;go('detail');notify('已创建题目');
}

function bindBank(){
  const update=(id,key,isBool)=>{const el=document.getElementById(id);if(!el)return;el.onchange=()=>{filter[key]=isBool?!filter[key]:el.value;render()}};
  update('projectFilter','project');update('categoryFilter','category');update('levelFilter','level');update('viewFilter','view');
  const st=document.getElementById('sortFilter');if(st)st.onchange=()=>{filter.sort=st.value;render()};
  // 表头排序
  document.querySelectorAll('th.sortable').forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort;
    if(filter.sort===k)filter.sortDir=filter.sortDir==='asc'?'desc':'asc';
    else{filter.sort=k;filter.sortDir='desc'}
    render();
  });
  const s=document.getElementById('searchFilter');
  s.oninput=()=>{
    const pos=s.selectionStart;filter.search=s.value;
    const y=window.scrollY;render();
    const n=document.getElementById('searchFilter');n.focus();n.setSelectionRange(pos,pos);
    window.scrollTo(0,y);
  };
  s.onfocus=()=>{searchHistoryOpen=true;render();setTimeout(()=>{const n=document.getElementById('searchFilter');if(n){n.focus();const l=filter.search.length;n.setSelectionRange(l,l)}},0)};
  s.onblur=()=>setTimeout(()=>{searchHistoryOpen=false;const h=document.getElementById('searchHistory');if(h)h.remove()},180);
  s.onkeydown=(e)=>{if(e.key==='Enter'){addSearchHistory(filter.search);searchHistoryOpen=false;render()}};
  document.querySelectorAll('.hitem').forEach(it=>{
    it.onmousedown=e=>{
      if(e.target.closest('.hx'))return;
      e.preventDefault();
      filter.search=it.dataset.kw;
      searchHistoryOpen=false;render();
    };
  });
  document.querySelectorAll('.hx').forEach(x=>x.onmousedown=e=>{
    e.preventDefault();e.stopPropagation();
    const kw=x.dataset.rm;
    db.searchHistory=db.searchHistory.filter(k=>k!==kw);save();render();
  });
  const ch=document.getElementById('clearHistory');
  if(ch)ch.onmousedown=e=>{e.preventDefault();db.searchHistory=[];save();render()};

  const sf=document.getElementById('starFilter');if(sf)sf.onclick=()=>{filter.starred=!filter.starred;render()};
  const sa=document.getElementById('selectAll');
  if(sa)sa.onchange=()=>{
    const ids=[...document.querySelectorAll('.rowCheck')].map(x=>x.dataset.id);
    if(sa.checked)ids.forEach(id=>selectedIds.add(id));else ids.forEach(id=>selectedIds.delete(id));
    render();
  };
  document.querySelectorAll('.rowCheck').forEach(c=>c.onchange=()=>{
    if(c.checked)selectedIds.add(c.dataset.id);else selectedIds.delete(c.dataset.id);render();
  });
  const cs=document.getElementById('clearSel');if(cs)cs.onclick=()=>{selectedIds.clear();render()};
  const bs=document.getElementById('batchStar');
  if(bs)bs.onclick=()=>{
    const backup=JSON.stringify(db.questions);
    db.questions.forEach(q=>{if(selectedIds.has(q.id))q.starred=true});
    save();render();notify('已批量收藏','ok',()=>{db.questions=JSON.parse(backup);save();render();notify('已撤销')});
  };
  const bu=document.getElementById('batchUnstar');
  if(bu)bu.onclick=()=>{
    const backup=JSON.stringify(db.questions);
    db.questions.forEach(q=>{if(selectedIds.has(q.id))q.starred=false});
    save();render();notify('已取消收藏','ok',()=>{db.questions=JSON.parse(backup);save();render();notify('已撤销')});
  };
  const bc=document.getElementById('batchCategory');
  if(bc)bc.onclick=()=>{
    openForm('批量修改分类',[{key:'categoryId',label:'目标分类',kind:'select',full:true,options:['未分类',...allCats().map(c=>c.name)]}],{categoryId:'未分类'},v=>{
      const backup=JSON.stringify(db.questions);
      const target=v.categoryId==='未分类'?null:allCats().find(c=>c.name===v.categoryId)?.id||null;
      db.questions.forEach(q=>{if(selectedIds.has(q.id))q.categoryId=target});
      save();render();notify('已批量修改分类','ok',()=>{db.questions=JSON.parse(backup);save();render();notify('已撤销')});
    });
  };
  const bl=document.getElementById('batchLevel');
  if(bl)bl.onclick=()=>{
    openForm('批量修改掌握度',[{key:'level',label:'掌握程度',kind:'select',full:true,options:LEVELS}],{level:'基本掌握'},v=>{
      const backup=JSON.stringify(db.questions);
      db.questions.forEach(q=>{if(selectedIds.has(q.id))q.masterLevel=v.level});
      save();render();notify('已批量修改掌握度','ok',()=>{db.questions=JSON.parse(backup);save();render();notify('已撤销')});
    });
  };
  const bd=document.getElementById('batchDelete');
  if(bd)bd.onclick=()=>{
    const n=selectedIds.size;
    confirmBox('批量删除题目',`将永久删除 <strong>${n}</strong> 道题及其回答、术语和复习记录。`,()=>{
      const backup=JSON.stringify(db.questions);
      db.questions=db.questions.filter(q=>!selectedIds.has(q.id));
      selectedIds.clear();save();render();
      notify(`已删除 ${n} 道题`,'ok',()=>{db.questions=JSON.parse(backup);save();render();notify('已撤销删除')});
    },{danger:true});
  };
}

function initEditors(){
  if(!window.Quill)return;
  const q=qget();if(!q)return;quills={};
  const colors=['#292d32','#647b78','#5276a7','#a45e5e','#b28b48','#6d7e59','#c45f68','#c96d68','#c98562','#c99a61','#c9b56b','#91ad79','#76a982','#6da99c','#6fa8b5','#6f91bd','#8b82bb','#ad83b6','#c17e9b','#a96c7e','#9478aa','#796a9d','#8f547c','#bd7299','#b9a4e8','#c985a5','#ffffff'];
  const toolbar=[[{'size':['small',false,'large','huge']}],['bold'],[{'color':colors}],['clean']];
  const defs=[['my','zh',q.answerMy.zh],['my','en',q.answerMy.en],['opt','zh',q.answerOpt.zh],['opt','en',q.answerOpt.en],['ext','zh',q.answerExt.zh],['ext','en',q.answerExt.en]];
  defs.forEach(([g,l,val])=>{
    const el=document.getElementById(`ed-${g}-${l}`);if(!el)return;
    const quill=new Quill(el,{theme:'snow',modules:{toolbar}});
    quill.root.innerHTML=val||'';quills[`${g}_${l}`]=quill;
    quill.on('text-change',()=>{dirty=true});
  });
}

function bindDetail(){
  const q=qget();if(!q)return;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));
    document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='panel-'+b.dataset.tab));
  });
  ['qTitle','qCategory','qLevel','qImportant','qDifficulty','qNext','qNote'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.oninput=el.onchange=()=>{dirty=true};
  });
  document.querySelectorAll('.qProject').forEach(c=>c.onchange=()=>{dirty=true});
  document.getElementById('saveQ').onclick=()=>{
    const val=id=>document.getElementById(id).value;
    q.title=val('qTitle').trim()||'未命名题目';
    q.categoryId=val('qCategory')||null;q.masterLevel=val('qLevel');
    q.important=+val('qImportant');q.difficulty=+val('qDifficulty');
    q.nextReviewAt=val('qNext')?new Date(val('qNext')+'T12:00:00').toISOString():null;
    q.note=val('qNote');
    q.projectTags=[...document.querySelectorAll('.qProject:checked')].map(x=>x.value);
    q.answerMy={zh:quills.my_zh?.root.innerHTML||'',en:quills.my_en?.root.innerHTML||''};
    q.answerOpt={zh:quills.opt_zh?.root.innerHTML||'',en:quills.opt_en?.root.innerHTML||''};
    q.answerExt={zh:quills.ext_zh?.root.innerHTML||'',en:quills.ext_en?.root.innerHTML||''};
    document.querySelectorAll('.termcard').forEach(card=>{
      const t=q.terms.find(t=>t.id===card.dataset.term);if(!t)return;
      card.querySelectorAll('[data-tfield]').forEach(el=>t[el.dataset.tfield]=el.value);
    });
    q.modifiedAt=new Date().toISOString();
    if(save()){dirty=false;notify('已保存全部修改')}
  };
  const addTerm=document.getElementById('addTerm');
  addTerm.onclick=()=>{
    q.terms.push({id:uid(),zh:'',en:'',expZh:'',expEn:''});
    refreshTerms();document.querySelector('[data-tab="terms"]').click();
    notify('已添加术语，请填写并保存');
  };
  const ts=document.getElementById('termSearch');if(ts)ts.oninput=()=>refreshTerms(ts.value);
  bindTermRemovals(q);
  document.getElementById('deleteQ').onclick=()=>confirmBox('删除题目','这会永久删除题目及其回答、术语和复习记录。',
    ()=>{
      const backup=JSON.stringify(db.questions);
      db.questions=db.questions.filter(x=>x.id!==q.id);
      save();currentId=null;go('bank');
      notify('题目已删除','ok',()=>{db.questions=JSON.parse(backup);save();go('bank');notify('已撤销删除')});
    },{danger:true});
  document.getElementById('reviewBtn').onclick=()=>{
    q.reviewCount=(q.reviewCount||0)+1;q.lastReviewAt=new Date().toISOString();
    const days=LEVEL_INTERVAL[q.masterLevel]||3;
    q.nextReviewAt=new Date(Date.now()+days*86400000).toISOString();
    q.modifiedAt=new Date().toISOString();
    save();notify(`复习记录已更新，下次 ${days} 天后`);render();
  };
  const tgl=document.getElementById('toggleStar');if(tgl)tgl.onclick=()=>{q.starred=!q.starred;save();render()};
  const dup=document.getElementById('duplicateQ');
  if(dup)dup.onclick=()=>{
    const n={...q,id:uid(),title:q.title+'（副本）',createdAt:new Date().toISOString(),modifiedAt:new Date().toISOString(),reviewCount:0,lastReviewAt:null};
    db.questions.unshift(n);save();currentId=n.id;render();notify('已复制题目');
  };
  const nq=document.getElementById('nextQ');
  if(nq)nq.onclick=()=>{
    const idx=db.questions.findIndex(x=>x.id===q.id);
    const next=db.questions[(idx+1)%db.questions.length];
    if(next){currentId=next.id;dirty=false;render();window.scrollTo(0,0)}
  };
}
function refreshTerms(kw=''){
  const q=qget();if(!q)return;
  const area=document.getElementById('termsArea');area.innerHTML=termsView(q,kw);bindTermRemovals(q);
}
function bindTermRemovals(q){
  document.querySelectorAll('.removeTerm').forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    confirmBox('删除术语','确定删除这条术语吗？删除后请保存题目。',()=>{
      const backup=JSON.stringify(q.terms);
      q.terms=q.terms.filter(t=>t.id!==id);refreshTerms();
      document.querySelector('[data-tab="terms"]').click();
      notify('术语已删除','ok',()=>{q.terms=JSON.parse(backup);refreshTerms();notify('已撤销删除')});
    },{danger:true});
  });
}

function bindPractice(){
  // 配置页
  const startBtn=document.getElementById('startPractice');
  if(startBtn)startBtn.onclick=()=>{
    const cat=document.getElementById('pCategory').value;
    const proj=document.getElementById('pProject').value;
    const lv=document.getElementById('pLevel').value;
    const vw=document.getElementById('pView').value;
    const cnt=+document.getElementById('pCount').value;
    let pool=db.questions.filter(q=>stripHtml(q.answerMy.zh)||stripHtml(q.answerMy.en));
    if(cat)pool=pool.filter(q=>q.categoryId===cat);
    if(proj)pool=pool.filter(q=>(q.projectTags||[]).includes(proj));
    if(lv)pool=pool.filter(q=>q.masterLevel===lv);
    if(vw==='overdue')pool=pool.filter(q=>q.nextReviewAt&&new Date(q.nextReviewAt)<new Date());
    if(vw==='starred')pool=pool.filter(q=>q.starred);
    if(!pool.length){notify('没有符合条件的题目','err');return}
    if(cnt>0)pool=pool.slice(0,cnt);
    practiceState={order:shuffle(pool.map(q=>q.id)),idx:0,revealed:false,round:1,total:pool.length};
    practiceConfig={category:cat,project:proj,level:lv,view:vw,count:cnt};
    render();
  };
  // 卡片页
  const reveal=document.getElementById('reveal');
  if(reveal)reveal.onclick=()=>{practiceState.revealed=true;render()};
  document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{
    const id=practiceState.order[practiceState.idx];
    const q=db.questions.find(x=>x.id===id);
    const g=b.dataset.grade;
    q.reviewCount=(q.reviewCount||0)+1;q.lastReviewAt=new Date().toISOString();
    if(g==='forgot'){q.masterLevel='不熟悉';q.nextReviewAt=new Date(Date.now()+1*86400000).toISOString()}
    else if(g==='vague'){q.masterLevel='基本掌握';q.nextReviewAt=new Date(Date.now()+3*86400000).toISOString()}
    else{const cur=LEVELS.indexOf(q.masterLevel);q.masterLevel=LEVELS[Math.min(cur+1,LEVELS.length-1)];q.nextReviewAt=new Date(Date.now()+(LEVEL_INTERVAL[q.masterLevel]||15)*86400000).toISOString()}
    save();advance();
  });
  const r=document.getElementById('reshuffle');
  if(r)r.onclick=()=>{practiceState.order=shuffle(practiceState.order);practiceState.idx=0;practiceState.revealed=false;render();notify('已重新洗牌')};
  const ep=document.getElementById('endPractice');
  if(ep)ep.onclick=()=>{practiceState=null;render();notify('已结束本次自测')};
  const p=document.getElementById('prevCard');
  if(p)p.onclick=()=>{practiceState.idx=(practiceState.idx-1+practiceState.total)%practiceState.total;practiceState.revealed=false;render()};
  const s=document.getElementById('skipCard');
  if(s)s.onclick=advance;
}
function advance(){
  practiceState.idx++;practiceState.revealed=false;
  if(practiceState.idx>=practiceState.total){
    practiceState.idx=0;practiceState.round++;
    practiceState.order=shuffle(practiceState.order);
    notify('完成一轮，继续加油！');
  }
  render();
}

function bindStats(){
  const pb=document.getElementById('printBtn');
  if(pb)pb.onclick=()=>go('print');
}

function bindProjects(){
  document.getElementById('addProject').onclick=()=>openForm('新增申请项目',[
    {key:'name',label:'项目名称',required:true,full:true,placeholder:'例如：MSc Economics'},
    {key:'school',label:'学校名称',required:true,placeholder:'学校或院系'},
    {key:'type',label:'项目类型',required:true,placeholder:'硕士 / 博士 / MPhil'},
    {key:'direction',label:'申请方向',required:true,full:true,placeholder:'专业或研究方向'}
  ],{},v=>{db.projects.push({id:uid(),...v});save();render();notify('项目已添加')});
  document.querySelectorAll('.editProject').forEach(b=>b.onclick=()=>{
    const p=db.projects.find(x=>x.id===b.dataset.id);if(!p)return;
    openForm('编辑申请项目',[
      {key:'name',label:'项目名称',required:true,full:true},{key:'school',label:'学校名称',required:true},
      {key:'type',label:'项目类型',required:true},{key:'direction',label:'申请方向',required:true,full:true}
    ],p,v=>{Object.assign(p,v);save();render();notify('项目资料已更新')});
  });
  document.querySelectorAll('.deleteProject').forEach(b=>b.onclick=()=>{
    const p=db.projects.find(x=>x.id===b.dataset.id);if(!p)return;
    confirmBox('删除申请项目',`将删除 <strong>${esc(p.name)}</strong>，并从相关题目中移除该项目标签；题目与回答不会删除。`,
      ()=>{
        const backup=JSON.stringify({projects:db.projects,questions:db.questions});
        db.projects=db.projects.filter(x=>x.id!==p.id);
        db.questions.forEach(q=>q.projectTags=(q.projectTags||[]).filter(id=>id!==p.id));
        save();render();
        notify('项目已删除','ok',()=>{const b=JSON.parse(backup);db.projects=b.projects;db.questions=b.questions;save();render();notify('已撤销')});
      },{danger:true});
  });
}

function bindCategories(){
  document.getElementById('addCategory').onclick=()=>openForm('新增主分类',
    [{key:'name',label:'分类名称',required:true,full:true,placeholder:'例如：研究方法与识别策略'}],{},
    v=>{db.categories.push({id:uid(),name:v.name,children:[]});save();render();notify('分类已添加')});
  document.querySelectorAll('.addSub').forEach(b=>b.onclick=()=>{
    const p=db.categories.find(c=>c.id===b.dataset.id);
    openForm('新增子分类',[{key:'name',label:'子分类名称',required:true,full:true}],{},
      v=>{p.children.push({id:uid(),name:v.name});save();render();notify('子分类已添加')});
  });
  document.querySelectorAll('.editCategory').forEach(b=>b.onclick=()=>{
    const c=db.categories.find(c=>c.id===b.dataset.id);
    openForm('重命名主分类',[{key:'name',label:'分类名称',required:true,full:true}],c,
      v=>{c.name=v.name;save();render();notify('分类名称已更新')});
  });
  document.querySelectorAll('.editSub').forEach(b=>b.onclick=()=>{
    const p=db.categories.find(c=>c.id===b.dataset.parent);
    const s=p.children.find(x=>x.id===b.dataset.id);
    openForm('重命名子分类',[{key:'name',label:'子分类名称',required:true,full:true}],s,
      v=>{s.name=v.name;save();render();notify('子分类名称已更新')});
  });
  document.querySelectorAll('.deleteCategory').forEach(b=>b.onclick=()=>{
    const c=db.categories.find(c=>c.id===b.dataset.id);
    const ids=[c.id,...c.children.map(s=>s.id)];
    const count=db.questions.filter(q=>ids.includes(q.categoryId)).length;
    confirmBox('删除主分类',`分类 <strong>${esc(c.name)}</strong> 包含 ${c.children.length} 个子分类，关联 ${count} 道题。删除后这些题目和答案仍保留，分类归属变为“未分类”。`,
      ()=>{
        const backup=JSON.stringify({categories:db.categories,questions:db.questions});
        db.categories=db.categories.filter(x=>x.id!==c.id);
        db.questions.forEach(q=>{if(ids.includes(q.categoryId))q.categoryId=null});
        save();render();
        notify('分类已删除，题目内容已保留','ok',()=>{const b=JSON.parse(backup);db.categories=b.categories;db.questions=b.questions;save();render();notify('已撤销')});
      },{danger:true});
  });
  document.querySelectorAll('.deleteSub').forEach(b=>b.onclick=()=>{
    const p=db.categories.find(c=>c.id===b.dataset.parent);
    const s=p.children.find(x=>x.id===b.dataset.id);
    const count=db.questions.filter(q=>q.categoryId===s.id).length;
    confirmBox('删除子分类',`子分类 <strong>${esc(s.name)}</strong> 关联 ${count} 道题。删除后题目和答案会保留，分类归属变为“未分类”。`,
      ()=>{
        const backup=JSON.stringify({categories:db.categories,questions:db.questions});
        p.children=p.children.filter(x=>x.id!==s.id);
        db.questions.forEach(q=>{if(q.categoryId===s.id)q.categoryId=null});
        save();render();
        notify('子分类已删除','ok',()=>{const b=JSON.parse(backup);db.categories=b.categories;db.questions=b.questions;save();render();notify('已撤销')});
      },{danger:true});
  });
}

function bindSettings(){
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
    db.themeMode=b.dataset.mode;
    if(b.dataset.mode!=='system')db.theme=b.dataset.mode;
    save();render();
  });
  document.querySelectorAll('.themecard').forEach(c=>c.onclick=()=>{
    db.palette=c.dataset.palette;save();render();
    notify(`已切换到「${THEMES[db.palette].name}」`);
  });
  document.getElementById('exportJson').onclick=exportJson;
  document.getElementById('restoreJson').onclick=restore;
  document.getElementById('exportCsv').onclick=exportCsv;
  document.getElementById('exportMd').onclick=exportMarkdown;
  const gprint=document.getElementById('goPrint');if(gprint)gprint.onclick=()=>go('print');
  document.getElementById('saveServer').onclick=()=>{db.serverUrl=document.getElementById('serverUrl').value.trim();save();notify('服务器地址已保存')};
  document.getElementById('syncServer').onclick=async()=>{
    const url=document.getElementById('serverUrl').value.trim();
    if(!url){notify('请先填写服务器 API URL','err');return}
    db.serverUrl=url;save();
    const btn=document.getElementById('syncServer');btn.disabled=true;
    const old=btn.textContent;btn.textContent='发送中…';
    try{
      const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(db)});
      if(!response.ok)throw new Error('HTTP '+response.status);
      notify('服务器已成功接收请求（HTTP '+response.status+'）');
    }catch(e){notify('发送失败：请检查 API 地址、网络、CORS 和服务器接口','err')}
    finally{btn.disabled=false;btn.textContent=old}
  };
}

/* ============================================================
   快捷键 & 离开提醒
   ============================================================ */
document.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  const tag=(e.target.tagName||'').toLowerCase();
  const inInput=tag==='input'||tag==='textarea'||e.target.isContentEditable;
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();if(page==='detail')document.getElementById('saveQ')?.click();else notify('当前无需保存');return}
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();if(page!=='bank'){go('bank');setTimeout(()=>document.getElementById('searchFilter')?.focus(),50)}else document.getElementById('searchFilter')?.focus();return}
  if(mod&&e.key.toLowerCase()==='p'){e.preventDefault();practiceState=null;go('practice');return}
  if(e.key==='Escape'){document.getElementById('modalroot').innerHTML='';return}
  if(inInput||mod)return;
  if(page==='practice'&&practiceState){
    if(e.key===' '){e.preventDefault();document.getElementById('reveal')?.click()}
    if(e.key==='1')document.querySelector('[data-grade="forgot"]')?.click();
    if(e.key==='2')document.querySelector('[data-grade="vague"]')?.click();
    if(e.key==='3')document.querySelector('[data-grade="good"]')?.click();
  }
  if(page==='bank'){
    if(e.key.toLowerCase()==='n'){e.preventDefault();newQuestion()}
    if(e.key==='j'||e.key==='k'){
      e.preventDefault();
      const rows=[...document.querySelectorAll('tbody tr[data-open]')];
      if(!rows.length)return;
      let idx=rows.findIndex(r=>r.classList.contains('selected-kb'));
      if(idx<0)idx=-1;
      idx=e.key==='j'?Math.min(idx+1,rows.length-1):Math.max(idx-1,0);
      rows.forEach(r=>r.classList.remove('selected-kb'));
      rows[idx].classList.add('selected-kb');
      rows[idx].scrollIntoView({block:'nearest'});
      rows[idx].style.outline='2px solid var(--accent)';
      setTimeout(()=>rows.forEach(r=>r.style.outline=''),1200);
      rows[idx].dataset.kbFocus='1';
    }
    if(e.key==='Enter'){
      const r=document.querySelector('tbody tr[data-open][data-kb-focus="1"]');
      if(r)document.querySelector(`[data-open="${r.dataset.open}"]`)?.click();
    }
  }
});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

/* ============================================================
   启动
   ============================================================ */
render();
</script>
